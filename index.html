<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prateleira de Imóveis | SuperCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* Estilização da barra de rolagem para o tema escuro */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen pb-12 selection:bg-amber-400 selection:text-slate-900">

    <div class="max-w-7xl mx-auto space-y-4 p-4">
        
        <!-- CABEÇALHO PRINCIPAL -->
        <header class="bg-slate-950 border border-slate-800 p-5 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-t-4 border-t-amber-400">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-amber-400 tracking-tight uppercase">PRATELEIRA DE IMÓVEIS</h1>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mt-1">Painel Multimarcas • Catálogo Privado</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2 text-xs font-bold">
                    <span class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300" id="badgeCountGlobal">🏷️ 0 Globais</span>
                    <span class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300" id="badgeCountPrivado">🔒 0 Privados</span>
                    <span class="px-3 py-1.5 rounded-lg bg-amber-400 text-slate-900 shadow-md" id="badgeContador">0 Imóveis</span>
                </div>
                <button onclick="abrirModalCadastro()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-xl text-xs transition flex items-center gap-2 shadow-md">
                    <span>➕</span> Cadastrar Avulso / Terceiros
                </button>
            </div>
        </header>

        <!-- BARRA DE FILTROS AVANÇADOS COMPLETA -->
        <section class="bg-slate-950 p-4 md:p-6 rounded-2xl shadow-lg border border-slate-800 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Construtora</label>
                    <select id="filtroConstrutora" onchange="atualizarEmpreendimentos(); filtrarEstoque();" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition">
                        <option value="TODAS">Todas as Construtoras</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Empreendimento</label>
                    <select id="filtroEmpreendimento" onchange="filtrarEstoque()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition">
                        <option value="TODOS">Todos os Empreendimentos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Enquadramento / Renda</label>
                    <select id="filtroGaveta" onchange="filtrarEstoque()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition">
                        <option value="TODAS">Todos (HIS, HMP, R2V...)</option>
                        <option value="HIS">HIS (Interesse Social)</option>
                        <option value="HMP">HMP (Mercado Popular)</option>
                        <option value="NR">NR (Não Residencial)</option>
                        <option value="R2V">R2V (Livre)</option>
                        <option value="LIVRE">Avulso / Terceiros</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Status da Obra</label>
                    <select id="filtroStatusObra" onchange="filtrarEstoque()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition">
                        <option value="TODOS">Todos os Status</option>
                        <option value="PRONTO">🏠 Pronto para Morar</option>
                        <option value="OBRA">🏗️ Em Construção</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Metragem (m²)</label>
                    <select id="filtroM2" onchange="filtrarEstoque()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition">
                        <option value="TODAS">Qualquer Metragem</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Tipologia</label>
                    <select id="filtroDorms" onchange="filtrarEstoque()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition">
                        <option value="0">Qualquer Tipologia</option>
                        <option value="1">Studio / 1 Dormitório</option>
                        <option value="2">2+ Dormitórios</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Ordenação</label>
                    <select id="selOrdenacao" onchange="filtrarEstoque()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition">
                        <option value="andar_desc">Andar (Mais Alto)</option>
                        <option value="preco_asc">Menor Preço Total</option>
                        <option value="preco_desc">Maior Preço Total</option>
                        <option value="m2_asc">Menor Preço por m²</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Busca Direta</label>
                    <input type="text" id="filtroTexto" onkeyup="filtrarEstoque()" placeholder="Nº Apto..." class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold focus:border-amber-400 focus:ring-1 focus:ring-amber-400 outline-none transition placeholder-slate-600">
                </div>
            </div>
        </section>

        <!-- ÁREA DE RESULTADOS (DARK CARDS) -->
        <main>
            <div id="loading" class="py-16 text-center">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-amber-400 mx-auto mb-3"></div>
                <p class="text-slate-400 font-bold text-sm" id="loadingText">Conectando ao banco de dados...</p>
            </div>
            
            <div id="listaImoveis" class="space-y-3 hidden mt-4">
                <!-- Cartões injetados via JavaScript baseados na imagem aprovada -->
            </div>
        </main>
    </div>

    <!-- MODAL DE CADASTRO PRIVADO / TERCEIROS (RESTAURADO) -->
    <div id="modalCadastro" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-sm font-black text-amber-400 uppercase">Cadastrar Imóvel de Terceiros</h2>
                <button onclick="fecharModalCadastro()" class="text-slate-500 hover:text-white font-bold text-xl transition">✕</button>
            </div>
            <form id="formNovoImovel" onsubmit="salvarImovelPrivado(event)" class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Construtora Original</label>
                        <input type="text" id="addConstrutora" required class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Empreendimento</label>
                        <input type="text" id="addEmpreendimento" required class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Unidade</label>
                        <input type="text" id="addUnidade" required class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500 text-center">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Andar</label>
                        <input type="number" id="addPavimento" required class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500 text-center">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Área (m²)</label>
                        <input type="number" step="0.01" id="addM2" required class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500 text-center">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Tipologia</label>
                        <select id="addTipologia" class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500">
                            <option value="Studio">Studio</option>
                            <option value="1 Dorm">1 Dormitório</option>
                            <option value="2 Dorms">2 Dormitórios</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Enquadramento</label>
                        <select id="addEnquadramento" class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500">
                            <option value="R2V">R2V</option>
                            <option value="LIVRE">Livre / Avulso</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 font-bold mb-1 text-xs">Vagas</label>
                        <input type="number" id="addVagas" value="0" class="w-full bg-slate-950 border border-slate-800 text-white rounded-lg p-2.5 outline-none focus:border-indigo-500 text-center">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-400 font-bold mb-1 text-xs">Valor Total (R$)</label>
                    <input type="text" id="addPrecoTabela" required onkeyup="formataMoedaLocal(this)" placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 text-amber-400 rounded-lg p-3 outline-none focus:border-indigo-500 text-right font-black text-lg">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="fecharModalCadastro()" class="bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold px-5 py-2.5 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-lg">Salvar Imóvel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let unidadesGlobais = [];

        window.onload = async () => {
            await carregarDadosSupabase();
        };

        async function carregarDadosSupabase() {
            try {
                // Configuração robusta do cliente para evitar "0 globais"
                const supabaseClient = window._supabase || window.supabase;
                if (!supabaseClient) throw new Error("Cliente Supabase não configurado no arquivo supabase-config.js");

                // Filtra EXCLUSIVAMENTE o que for DISPONIVEL direto no banco
                const { data, error } = await supabaseClient
                    .from('units')
                    .select('*, developments(title, developer_name, is_ready, delivery_date)')
                    .eq('status', 'DISPONIVEL');

                if (error) throw error;

                if (data && data.length > 0) {
                    unidadesGlobais = data.map(u => {
                        const construtoraNome = u.developments?.developer_name || u.builder || "AAM Incorporadora";
                        const isTerceiros = construtoraNome.toLowerCase().includes('terceiros') || construtoraNome.toLowerCase().includes('avulso');
                        const areaM2 = parseFloat(u.private_area_m2) || 0;
                        const precoVal = parseFloat(u.list_price) || 0;
                        
                        return {
                            id: u.id,
                            empreendimento: u.developments?.title || u.development_name || "Empreendimento",
                            construtora: construtoraNome,
                            unidade: String(u.unit_number || "---"),
                            pavimento: parseInt(u.floor) || 1,
                            tipologia: u.typology || "Studio",
                            income_type: u.income_type || "R2V",
                            m2: areaM2,
                            precoTabela: precoVal,
                            precoM2: areaM2 > 0 ? (precoVal / areaM2) : 0,
                            vagas: u.parking_spaces || 0,
                            is_ready: u.is_ready !== undefined ? u.is_ready : (u.developments?.is_ready || false),
                            origem: isTerceiros ? 'PRIVADO' : 'GLOBAL',
                            
                            // Mapeamento financeiro integral para o supercalc não quebrar
                            val_ato: parseFloat(u.val_ato) || 0,
                            val_30_60_90: parseFloat(u.val_30_60_90) || 0,
                            qtd_mensais: parseInt(u.qtd_mensais) || 0,
                            val_mensal_unit: parseFloat(u.val_mensal_unit) || 0,
                            qtd_anuais: parseInt(u.qtd_anuais) || 0,
                            val_anual_unit: parseFloat(u.val_anual_unit) || 0,
                            val_periodicidade: parseFloat(u.val_periodicidade) || 0,
                            val_chaves_unica: parseFloat(u.val_chaves_unica) || 0,
                            val_financiamento: parseFloat(u.val_financiamento) || 0
                        };
                    });
                }

                // Mescla com imóveis privados cadastrados localmente
                const privados = JSON.parse(localStorage.getItem("IMOVEIS_PRIVADOS") || "[]");
                unidadesGlobais = [...unidadesGlobais, ...privados];

                atualizarEmpreendimentos();
                popularFiltroMetragem();
                filtrarEstoque();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingText').innerHTML = `<span class="text-red-400">Erro de conexão: ${err.message}</span>`;
                document.querySelector('.animate-spin').classList.add('hidden');
            }
        }

        function atualizarEmpreendimentos() {
            const construtoraSel = document.getElementById("filtroConstrutora").value;
            
            const construtorasUnicas = [...new Set(unidadesGlobais.map(u => u.construtora))].sort();
            const constrSelect = document.getElementById("filtroConstrutora");
            const atualConstr = constrSelect.value;
            constrSelect.innerHTML = '<option value="TODAS">Todas as Construtoras</option>' + 
                construtorasUnicas.map(c => `<option value="${c}">${c}</option>`).join('');
            constrSelect.value = atualConstr;

            const selectEmp = document.getElementById("filtroEmpreendimento");
            const filtradosEmp = unidadesGlobais.filter(u => construtoraSel === "TODAS" || u.construtora === construtoraSel);
            const empreendimentosUnicos = [...new Set(filtradosEmp.map(u => u.empreendimento))].sort();
            
            const atualEmp = selectEmp.value;
            selectEmp.innerHTML = '<option value="TODOS">Todos os Empreendimentos</option>' + 
                empreendimentosUnicos.map(e => `<option value="${e}">${e}</option>`).join('');
            selectEmp.value = atualEmp;
        }

        function popularFiltroMetragem() {
            const metragens = [...new Set(unidadesGlobais.map(u => u.m2))]
                .filter(m => m > 0)
                .sort((a, b) => a - b);
                
            const selectM2 = document.getElementById("filtroM2");
            selectM2.innerHTML = '<option value="TODAS">Qualquer Metragem</option>' + 
                metragens.map(m => `<option value="${m}">${m.toFixed(2)} m²</option>`).join('');
        }

        function filtrarEstoque() {
            const construtora = document.getElementById("filtroConstrutora").value;
            const empreendimento = document.getElementById("filtroEmpreendimento").value;
            const gaveta = document.getElementById("filtroGaveta").value;
            const statusObra = document.getElementById("filtroStatusObra").value;
            const m2Filtro = document.getElementById("filtroM2").value;
            const dorms = parseInt(document.getElementById("filtroDorms").value) || 0;
            const ordenacao = document.getElementById("selOrdenacao").value;
            const texto = document.getElementById("filtroTexto").value.toLowerCase().trim();

            const filtrados = unidadesGlobais.filter(u => {
                const bateConstrutora = construtora === "TODAS" || u.construtora === construtora;
                const bateEmpreendimento = empreendimento === "TODOS" || u.empreendimento === empreendimento;
                const bateGaveta = gaveta === "TODAS" || (gaveta === "LIVRE" ? (u.income_type === 'LIVRE' || u.origem === 'PRIVADO') : u.income_type === gaveta);
                const bateStatusObra = statusObra === "TODOS" || (statusObra === "PRONTO" ? u.is_ready : !u.is_ready);
                const bateM2 = m2Filtro === "TODAS" || u.m2 === parseFloat(m2Filtro);
                const bateDorms = dorms === 0 || (dorms === 1 ? (u.tipologia.toLowerCase().includes('studio') || u.tipologia.toLowerCase().includes('1')) : !u.tipologia.toLowerCase().includes('studio') && !u.tipologia.toLowerCase().includes('1 dorm'));
                const bateTexto = !texto || u.unidade.toLowerCase().includes(texto) || u.empreendimento.toLowerCase().includes(texto);

                return bateConstrutora && bateEmpreendimento && bateGaveta && bateStatusObra && bateM2 && bateDorms && bateTexto;
            });

            if (ordenacao === "andar_desc") filtrados.sort((a,b) => b.pavimento - a.pavimento);
            if (ordenacao === "preco_asc") filtrados.sort((a,b) => a.precoTabela - b.precoTabela);
            if (ordenacao === "preco_desc") filtrados.sort((a,b) => b.precoTabela - a.precoTabela);
            if (ordenacao === "m2_asc") filtrados.sort((a,b) => a.precoM2 - b.precoM2);

            const totaisGlobais = unidadesGlobais.filter(u => u.origem === 'GLOBAL').length;
            const totaisPrivados = unidadesGlobais.filter(u => u.origem === 'PRIVADO').length;

            document.getElementById("badgeCountGlobal").innerText = `🏷️ ${totaisGlobais} Globais`;
            document.getElementById("badgeCountPrivado").innerText = `🔒 ${totaisPrivados} Privados`;
            document.getElementById("badgeContador").innerText = `${filtrados.length} Imóveis`;

            document.getElementById("loading").classList.add("hidden");
            const container = document.getElementById("listaImoveis");
            container.classList.remove("hidden");

            if(filtrados.length === 0) {
                container.innerHTML = `<div class="text-center p-12 text-slate-400 font-bold bg-slate-950 rounded-2xl border border-slate-800 shadow-inner">Nenhum imóvel disponível encontrado para os filtros selecionados.</div>`;
                return;
            }

            // RENDERIZAÇÃO DOS CARTÕES IDÊNTICOS À IMAGEM APROVADA
            container.innerHTML = filtrados.map(u => {
                const iconeStatus = u.is_ready ? '🏠' : '🏗️';
                const textoStatus = u.is_ready ? 'Pronto' : 'Na Planta';
                
                return `
                    <div class="bg-slate-800/60 rounded-xl p-4 border border-slate-700/50 shadow-md flex justify-between items-center hover:bg-slate-800 transition duration-200">
                        <div class="flex-1">
                            <h3 class="text-sm font-black text-white mb-0.5">${u.empreendimento}</h3>
                            <p class="text-xs text-slate-400 leading-snug">
                                Apto ${u.unidade} • ${u.m2.toFixed(2)} m² •<br>
                                ${u.pavimento}º Andar • ${u.tipologia}
                            </p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <p class="text-[9px] text-slate-400 uppercase font-bold tracking-widest mb-0.5">Valor Tabela</p>
                                <p class="text-base sm:text-lg font-black text-amber-400 leading-none">R$ ${u.precoTabela.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                            </div>
                            <button onclick="simular('${u.id}')" class="bg-emerald-500 hover:bg-emerald-400 text-white font-black px-4 py-2.5 rounded-lg text-sm transition shadow-md shadow-emerald-900/20 active:scale-95">
                                Simular
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Funções do Modal de Terceiros
        function abrirModalCadastro() { document.getElementById("modalCadastro").classList.remove("hidden"); }
        function fecharModalCadastro() { document.getElementById("modalCadastro").classList.add("hidden"); }

        function formataMoedaLocal(i) {
            let v = i.value.replace(/\D/g,'');
            if(!v) { i.value = "0,00"; return; }
            v = (v/100).toFixed(2) + '';
            v = v.replace(".", ",");
            v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
            i.value = v;
        }

        function salvarImovelPrivado(e) {
            e.preventDefault();
            const precoStr = document.getElementById("addPrecoTabela").value.replace(/\./g, '').replace(',', '.');
            
            const novoImovel = {
                id: "PRIV_" + Date.now(),
                origem: "PRIVADO",
                construtora: document.getElementById("addConstrutora").value.trim(),
                empreendimento: document.getElementById("addEmpreendimento").value.trim(),
                unidade: document.getElementById("addUnidade").value.trim(),
                pavimento: parseInt(document.getElementById("addPavimento").value) || 0,
                m2: parseFloat(document.getElementById("addM2").value) || 0,
                tipologia: document.getElementById("addTipologia").value,
                income_type: document.getElementById("addEnquadramento").value,
                vagas: parseInt(document.getElementById("addVagas").value) || 0,
                precoTabela: parseFloat(precoStr) || 0,
                is_ready: true,
                status: 'DISPONIVEL'
            };

            const existentes = JSON.parse(localStorage.getItem("IMOVEIS_PRIVADOS") || "[]");
            existentes.unshift(novoImovel);
            localStorage.setItem("IMOVEIS_PRIVADOS", JSON.stringify(existentes));

            fecharModalCadastro();
            document.getElementById("formNovoImovel").reset();
            carregarDadosSupabase(); 
        }

        // Envia o pacote completo intacto para a calculadora
        function simular(id) {
            const u = unidadesGlobais.find(item => item.id === id);
            if(u) {
                localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(u));
                window.location.href = "supercalc.html";
            }
        }
    </script>
</body>
</html>
