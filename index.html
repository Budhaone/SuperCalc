<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prateleira de Imóveis - SuperCalc</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon supercalc energiaflix.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client & Configuração -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="bg-slate-100 font-sans p-2 md:p-5 text-slate-800">

    <!-- OVERLAY DE CARREGAMENTO -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white transition-opacity duration-300">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-400 border-t-transparent mb-3"></div>
        <p class="font-bold text-sm text-amber-300">Carregando Prateleira de Imóveis...</p>
    </div>

    <div class="max-w-7xl mx-auto space-y-3">

        <!-- CABEÇALHO DO CATÁLOGO -->
        <header class="bg-slate-900 text-white p-3.5 md:p-5 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-3 border-b-4 border-amber-400">
            <div>
                <h1 class="text-lg md:text-2xl font-black tracking-tight">PRATELEIRA DE IMÓVEIS</h1>
                <p class="text-[11px] md:text-xs text-amber-400 font-bold uppercase tracking-wider">Painel Multimarcas • Catálogo & Inventário Privado</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <div class="flex items-center gap-1.5 text-xs font-bold">
                    <span class="px-2.5 py-1 bg-slate-800 text-slate-200 rounded-lg border border-slate-700" id="badgeCountGlobal">🏷️ 0 Globais</span>
                    <span class="px-2.5 py-1 bg-amber-400/20 text-amber-300 rounded-lg border border-amber-400/30" id="badgeCountPrivado">🔒 0 Privados</span>
                </div>
                <!-- BOTÃO RESTAURADO: INSERIR IMÓVEL DE TERCEIROS / AVULSO -->
                <button onclick="abrirModalCadastro()" class="bg-purple-700 hover:bg-purple-600 text-white font-bold py-2 px-3.5 rounded-xl text-xs md:text-sm transition flex items-center gap-1 shadow-md">
                    ➕ Cadastrar Imóvel Terceiros / Avulso
                </button>
            </div>
        </header>

        <!-- BARRA DE FILTROS COMBINADOS -->
        <section class="bg-white p-3 md:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-xs md:text-sm font-bold text-slate-900 uppercase tracking-wider">Filtros de Busca e Seleção</h2>
                <button onclick="limparFiltros()" class="text-xs text-blue-600 font-bold hover:underline">Limpar Filtros</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5">
                <!-- 1. Origem / Construtora -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Incorporadora / Origem</label>
                    <select id="filtroConstrutora" onchange="atualizarEmpreendimentos(); filtrarEstoque();" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-medium bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none">
                        <option value="TODAS">Todas as Construtoras</option>
                        <option value="PRIVADO">🔒 Inventário Privado (Terceiros)</option>
                    </select>
                </div>

                <!-- 2. Empreendimento -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Empreendimento / Edifício</label>
                    <select id="filtroEmpreendimento" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-medium bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none">
                        <option value="TODOS">Todos os Empreendimentos</option>
                    </select>
                </div>

                <!-- 3. Tipo de Renda / Enquadramento -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Tipo de Renda / Enquadramento</label>
                    <select id="filtroIncomeType" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-medium bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none">
                        <option value="TODOS">Todos os Enquadramentos</option>
                        <option value="HIS">HIS (Habitação de Interesse Social)</option>
                        <option value="HMP">HMP (Mercado Popular)</option>
                        <option value="R2V">R2V (Residencial Livre)</option>
                        <option value="NR">NR (Não Residencial / Serviços)</option>
                    </select>
                </div>

                <!-- 4. Metragem (Ordem Crescente) -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Metragem (m²)</label>
                    <select id="filtroMetragem" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-medium bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none">
                        <option value="TODAS">Todas as Metragens</option>
                    </select>
                </div>

                <!-- 5. Dormitórios -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Dormitórios</label>
                    <select id="filtroDorms" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-medium bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none">
                        <option value="TODOS">Todos os Dormitórios</option>
                        <option value="0">Studio / Loft (0 dorms)</option>
                        <option value="1">1 Dormitório</option>
                        <option value="2">2 Dormitórios</option>
                        <option value="3">3 Dormitórios</option>
                        <option value="4+">4+ Dormitórios</option>
                    </select>
                </div>

                <!-- 6. Vagas -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Vagas de Garagem</label>
                    <select id="filtroVagas" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-medium bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none">
                        <option value="TODAS">Todas as Opções</option>
                        <option value="0">Sem vaga</option>
                        <option value="1">1 vaga</option>
                        <option value="2">2 vagas</option>
                        <option value="3+">3+ vagas</option>
                    </select>
                </div>

                <!-- 7. Preço Máximo -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Preço Máximo de Tabela (R$)</label>
                    <input type="number" id="filtroPrecoMax" step="50000" placeholder="Ex: 600000" oninput="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-medium bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-900 outline-none">
                </div>

                <!-- 8. Digitação / Busca por Unidade -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-0.5">Buscar por Unidade</label>
                    <input type="text" id="filtroUnidade" placeholder="Ex: 510, 622, 1204..." oninput="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-2 text-xs md:text-sm font-bold bg-amber-50 focus:bg-white focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
            </div>
        </section>

        <!-- LISTA COMPACTA DE UNIDADES EM FORMATO DE CARTÃO SIMPLIFICADO -->
        <main class="space-y-2" id="containerEstoque">
            <!-- Renderizado Dinamicamente pelo JavaScript -->
        </main>
    </div>

    <!-- MODAL DE CADASTRO DE IMÓVEIS PRIVADOS / TERCEIROS -->
    <div id="modalCadastro" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-4 md:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-slate-900 text-sm md:text-base uppercase">➕ Cadastrar Imóvel Terceiros / Avulso</h3>
                <button onclick="fecharModalCadastro()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">&times;</button>
            </div>

            <form id="formNovoImovel" onsubmit="salvarImovelPrivado(event)" class="space-y-3 text-xs md:text-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Empreendimento / Edifício *</label>
                        <input type="text" id="addEmpreendimento" required placeholder="Ex: Poema Liberdade" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Nº da Unidade *</label>
                        <input type="text" id="addUnidade" required placeholder="Ex: 512" class="w-full border p-2 rounded-lg font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Área (m²) *</label>
                        <input type="number" id="addM2" step="0.1" required placeholder="Ex: 48.25" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Andar / Pavimento *</label>
                        <input type="number" id="addPavimento" required placeholder="Ex: 5" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Dormitórios *</label>
                        <input type="number" id="addDorms" min="0" required placeholder="Ex: 2" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Vagas *</label>
                        <input type="number" id="addVagas" min="0" required placeholder="Ex: 1" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Tipo de Renda / Enquadramento</label>
                        <select id="addIncomeType" class="w-full border p-2 rounded-lg font-medium bg-white">
                            <option value="R2V">R2V (Residencial Livre)</option>
                            <option value="HMP">HMP (Mercado Popular)</option>
                            <option value="HIS">HIS (Habitação Social)</option>
                            <option value="NR">NR (Não Residencial)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Status da Obra</label>
                        <select id="addIsReady" class="w-full border p-2 rounded-lg font-medium bg-white">
                            <option value="false">🏗️ Em Construção</option>
                            <option value="true">🏠 Pronto para Morar</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-0.5">Preço Total de Venda / Tabela (R$) *</label>
                    <input type="number" id="addPrecoTabela" step="1000" required placeholder="Ex: 550000" class="w-full border p-2.5 rounded-lg font-black text-base text-slate-900">
                </div>

                <div class="flex gap-2 pt-2 border-t">
                    <button type="button" onclick="fecharModalCadastro()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2.5 rounded-xl transition">
                        Cancelar
                    </button>
                    <button type="submit" class="w-1/2 bg-purple-700 hover:bg-purple-600 text-white font-bold py-2.5 rounded-xl transition shadow-md">
                        💾 Salvar no Inventário Privado
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE INTELIGÊNCIA E CARGA DE DADOS -->
    <script>
        let ESTOQUE_GLOBAL = [];

        async function carregarEstoqueSupabase() {
            try {
                exibirLoading(true);

                let query = window.supabaseClient
                    .from('units')
                    .select('*');

                const { data, error } = await query;

                if (error) {
                    console.error("Erro ao buscar dados do Supabase:", error);
                    alert("Atenção: Não foi possível carregar as unidades do Supabase.");
                    exibirLoading(false);
                    return;
                }

                ESTOQUE_GLOBAL = (data || []).map(u => ({
                    id: u.id,
                    empreendimento: u.development_name || u.empreendimento || 'Empreendimento',
                    construtora: u.builder || u.construtora || (u.is_third_party ? 'PRIVADO / TERCEIROS' : 'Incorporadora'),
                    unidade: u.unit_number || u.unidade || '---',
                    m2: parseFloat(u.private_area_m2 || u.m2 || 0),
                    pavimento: u.floor || u.pavimento || 1,
                    dorms: u.dorms !== undefined ? parseInt(u.dorms) : 1,
                    vagas: u.vagas !== undefined ? parseInt(u.vagas) : 0,
                    tipologia: u.typology || u.tipologia || `${u.dorms || 1} dorms`,
                    income_type: u.income_type || u.enquadramento || 'R2V',
                    precoTabela: parseFloat(u.list_price || u.precoTabela || u.preco || 0),
                    is_ready: u.is_ready || false,
                    is_third_party: u.is_third_party || false,
                    
                    // Engenharia de Fluxo do Banco
                    val_ato: parseFloat(u.val_ato || 0),
                    val_30_60_90: parseFloat(u.val_30_60_90 || 0),
                    qtd_mensais: parseInt(u.qtd_mensais || 36),
                    val_mensal_unit: parseFloat(u.val_mensal_unit || 0),
                    qtd_anuais: parseInt(u.qtd_anuais || 3),
                    val_anual_unit: parseFloat(u.val_anual_unit || 0),
                    val_chaves_unica: parseFloat(u.val_chaves_unica || 0),
                    val_financiamento: parseFloat(u.val_financiamento || 0)
                }));

                popularFiltroConstrutora();
                popularFiltroMetragem();
                atualizarEmpreendimentos();
                filtrarEstoque();

            } catch (err) {
                console.error("Erro crítico na execução:", err);
            } finally {
                exibirLoading(false);
            }
        }

        function popularFiltroConstrutora() {
            const select = document.getElementById("filtroConstrutora");
            const construtoras = [...new Set(ESTOQUE_GLOBAL.map(item => item.construtora))].sort();

            select.innerHTML = `<option value="TODAS">Todas as Construtoras</option>`;
            select.innerHTML += `<option value="PRIVADO">🔒 Inventário Privado (Terceiros)</option>`;

            construtoras.forEach(c => {
                if (c !== 'PRIVADO / TERCEIROS') {
                    select.innerHTML += `<option value="${c}">${c}</option>`;
                }
            });
        }

        function popularFiltroMetragem() {
            const select = document.getElementById("filtroMetragem");
            const metragens = [...new Set(ESTOQUE_GLOBAL.map(item => item.m2).filter(m => m > 0))].sort((a, b) => a - b);

            select.innerHTML = `<option value="TODAS">Todas as Metragens</option>`;
            metragens.forEach(m => {
                select.innerHTML += `<option value="${m}">${m.toFixed(2)} m²</option>`;
            });
        }

        function atualizarEmpreendimentos() {
            const construtoraSel = document.getElementById("filtroConstrutora").value;
            const selectEmp = document.getElementById("filtroEmpreendimento");

            let filtrados = ESTOQUE_GLOBAL;
            if (construtoraSel === "PRIVADO") {
                filtrados = ESTOQUE_GLOBAL.filter(i => i.is_third_party);
            } else if (construtoraSel !== "TODAS") {
                filtrados = ESTOQUE_GLOBAL.filter(i => i.construtora === construtoraSel);
            }

            const empreendimentos = [...new Set(filtrados.map(item => item.empreendimento))].sort();

            selectEmp.innerHTML = `<option value="TODOS">Todos os Empreendimentos</option>`;
            empreendimentos.forEach(e => {
                selectEmp.innerHTML += `<option value="${e}">${e}</option>`;
            });
        }

        function filtrarEstoque() {
            const construtoraSel = document.getElementById("filtroConstrutora").value;
            const empSel = document.getElementById("filtroEmpreendimento").value;
            const incomeSel = document.getElementById("filtroIncomeType").value;
            const m2Sel = document.getElementById("filtroMetragem").value;
            const dormsSel = document.getElementById("filtroDorms").value;
            const vagasSel = document.getElementById("filtroVagas").value;
            const precoMax = parseFloat(document.getElementById("filtroPrecoMax").value) || Infinity;
            const unidadeDigitada = document.getElementById("filtroUnidade").value.trim().toLowerCase();

            const resultado = ESTOQUE_GLOBAL.filter(item => {
                let matchConstrutora = construtoraSel === "TODAS" || (construtoraSel === "PRIVADO" ? item.is_third_party : item.construtora === construtoraSel);
                let matchEmp = empSel === "TODOS" || item.empreendimento === empSel;
                let matchIncome = incomeSel === "TODOS" || item.income_type === incomeSel;
                let matchM2 = m2Sel === "TODAS" || Math.abs(item.m2 - parseFloat(m2Sel)) < 0.05;

                let matchDorms = true;
                if (dormsSel === '0') matchDorms = (item.dorms === 0);
                else if (dormsSel === '1') matchDorms = (item.dorms === 1);
                else if (dormsSel === '2') matchDorms = (item.dorms === 2);
                else if (dormsSel === '3') matchDorms = (item.dorms === 3);
                else if (dormsSel === '4+') matchDorms = (item.dorms >= 4);

                let matchVagas = true;
                if (vagasSel === '0') matchVagas = (item.vagas === 0);
                else if (vagasSel === '1') matchVagas = (item.vagas === 1);
                else if (vagasSel === '2') matchVagas = (item.vagas === 2);
                else if (vagasSel === '3+') matchVagas = (item.vagas >= 3);

                let matchPreco = item.precoTabela <= precoMax;
                let matchUnidade = !unidadeDigitada || item.unidade.toLowerCase().includes(unidadeDigitada);

                return matchConstrutora && matchEmp && matchIncome && matchM2 && matchDorms && matchVagas && matchPreco && matchUnidade;
            });

            renderizarListaFormatada(resultado);
            atualizarBadgesContagem(resultado);
        }

        function renderizarListaFormatada(lista) {
            const container = document.getElementById("containerEstoque");
            container.innerHTML = "";

            if (lista.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl text-center text-slate-500 border border-slate-200">
                        <p class="font-bold text-base">Nenhuma unidade encontrada com os filtros selecionados.</p>
                        <p class="text-xs mt-1">Tente ajustar os critérios de busca acima.</p>
                    </div>`;
                return;
            }

            const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            lista.forEach(item => {
                const valM2 = item.m2 > 0 ? (item.precoTabela / item.m2) : 0;
                const isReady = item.is_ready;

                const card = document.createElement("div");
                card.className = "bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm hover:border-slate-400 transition flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs md:text-sm";

                card.innerHTML = `
                    <!-- COLUNA 1: DADOS DO IMÓVEL -->
                    <div class="space-y-1 flex-1">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-slate-900 text-sm md:text-base">${item.empreendimento}</span>
                            <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[10px] font-extrabold uppercase border border-slate-200">${item.construtora}</span>
                        </div>
                        <div class="text-slate-600 font-medium flex flex-wrap items-center gap-1.5">
                            <span class="text-amber-600 font-black">Apto ${item.unidade}</span>
                            <span class="text-slate-300">•</span>
                            <span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded text-[10px] font-black uppercase">${item.income_type}</span>
                            <span class="text-slate-300">•</span>
                            <span class="font-bold text-slate-800">${item.m2} m²</span>
                            <span class="text-slate-300">•</span>
                            <span class="text-slate-500">${item.pavimento}º Andar</span>
                            <span class="text-slate-300">•</span>
                            <span class="text-slate-500">${item.tipologia}</span>
                        </div>
                    </div>

                    <!-- COLUNA 2: STATUS -->
                    <div class="md:w-32 shrink-0">
                        <span class="inline-block px-2.5 py-1 rounded-md text-[10px] md:text-xs font-black uppercase ${isReady ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-blue-100 text-blue-800 border border-blue-200'}">
                            ${isReady ? '🏠 PRONTO' : '🏗️ EM OBRA'}
                        </span>
                    </div>

                    <!-- COLUNA 3: VALORES (TOTAL E M²) -->
                    <div class="md:w-44 text-left md:text-right shrink-0">
                        <div class="text-[10px] text-slate-400 font-bold uppercase">Valor de Tabela</div>
                        <div class="text-sm md:text-base font-black text-slate-900">${fmt(item.precoTabela)}</div>
                        <div class="text-[10px] md:text-xs text-emerald-600 font-bold">${fmt(valM2)}/m²</div>
                    </div>

                    <!-- COLUNA 4: BOTÃO SIMULAR -->
                    <div class="md:w-32 shrink-0">
                        <button onclick="enviarParaSuperCalc('${item.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-3 rounded-lg text-xs md:text-sm transition shadow-sm flex items-center justify-center gap-1">
                            ⚡ Simular
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function atualizarBadgesContagem(listaFiltrada) {
            const globais = listaFiltrada.filter(i => !i.is_third_party).length;
            const privados = listaFiltrada.filter(i => i.is_third_party).length;

            document.getElementById("badgeCountGlobal").innerText = `🏷️ ${globais} Globais`;
            document.getElementById("badgeCountPrivado").innerText = `🔒 ${privados} Privados`;
        }

        function enviarParaSuperCalc(id) {
            const item = ESTOQUE_GLOBAL.find(i => i.id === id);
            if (!item) return;

            localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(item));
            window.location.href = "supercalc.html";
        }

        function limparFiltros() {
            document.getElementById("filtroConstrutora").value = "TODAS";
            document.getElementById("filtroEmpreendimento").value = "TODOS";
            document.getElementById("filtroIncomeType").value = "TODOS";
            document.getElementById("filtroMetragem").value = "TODAS";
            document.getElementById("filtroDorms").value = "TODOS";
            document.getElementById("filtroVagas").value = "TODAS";
            document.getElementById("filtroPrecoMax").value = "";
            document.getElementById("filtroUnidade").value = "";
            filtrarEstoque();
        }

        function abrirModalCadastro() {
            document.getElementById("modalCadastro").classList.remove("hidden");
        }

        function fecharModalCadastro() {
            document.getElementById("modalCadastro").classList.add("hidden");
            document.getElementById("formNovoImovel").reset();
        }

        async function salvarImovelPrivado(e) {
            e.preventDefault();

            const novoItem = {
                development_name: document.getElementById("addEmpreendimento").value.trim(),
                unit_number: document.getElementById("addUnidade").value.trim(),
                private_area_m2: parseFloat(document.getElementById("addM2").value),
                floor: parseInt(document.getElementById("addPavimento").value),
                dorms: parseInt(document.getElementById("addDorms").value),
                vagas: parseInt(document.getElementById("addVagas").value),
                income_type: document.getElementById("addIncomeType").value,
                is_ready: document.getElementById("addIsReady").value === "true",
                list_price: parseFloat(document.getElementById("addPrecoTabela").value),
                builder: "PRIVADO / TERCEIROS",
                is_third_party: true
            };

            exibirLoading(true);

            const { data, error } = await window.supabaseClient
                .from('units')
                .insert([novoItem])
                .select();

            exibirLoading(false);

            if (error) {
                console.error("Erro ao salvar imóvel privado:", error);
                alert("Erro ao cadastrar imóvel no Supabase.");
                return;
            }

            alert("Imóvel de terceiro cadastrado com sucesso!");
            fecharModalCadastro();
            carregarEstoqueSupabase();
        }

        function exibirLoading(exibir) {
            const overlay = document.getElementById("loadingOverlay");
            if (exibir) {
                overlay.classList.remove("hidden");
            } else {
                overlay.classList.add("hidden");
            }
        }

        carregarEstoqueSupabase();
    </script>
</body>
</html>
