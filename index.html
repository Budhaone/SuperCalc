<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperCalc — Prateleira de Imóveis</title>
    <link rel="icon" type="image/png" href="favicon supercalc energiaflix.png">
    <style>
        :root {
            --primary: #1a252f;
            --accent: #f1c40f;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --success: #27ae60;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 16px; color: #333; }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid var(--accent); flex-wrap: wrap; gap: 10px;
        }

        h1 { margin: 0; font-size: 1.4rem; color: var(--accent); }
        p.sub { margin: 4px 0 0 0; font-size: 0.85rem; color: #cbd5e1; }

        .view-toggle { display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px; border-radius: 8px; }
        .view-btn { border: none; background: transparent; color: #fff; padding: 6px 12px; font-size: 0.8rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .view-btn.active { background: var(--accent); color: #000; }

        .filters-card {
            background: var(--card-bg); padding: 14px; border-radius: 12px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px;
        }

        label { display: block; font-size: 0.78rem; font-weight: bold; margin-bottom: 4px; color: #475569; }
        select, input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }

        /* VISTA EM CARDS */
        .grid-units { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
        .unit-card {
            background: var(--card-bg); border-radius: 10px; padding: 14px;
            border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .unit-card:hover { border-color: var(--accent); }
        .unit-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 8px; }
        .unit-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        .unit-badge { background: #e2e8f0; color: #334155; font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
        .unit-details { font-size: 0.85rem; color: #64748b; margin-bottom: 12px; line-height: 1.5; }
        .unit-price { font-size: 1.2rem; font-weight: 900; color: var(--success); margin-bottom: 10px; }

        /* VISTA EM TABELA */
        .table-container { background: #fff; border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; display: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
        th { background: #f8fafc; padding: 10px 12px; font-weight: bold; color: #475569; border-bottom: 2px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        tr:hover { background: #f1f5f9; }

        .btn-select {
            background: var(--primary); color: #fff; border: none;
            padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
            text-align: center; text-decoration: none; display: inline-block; font-size: 0.82rem;
        }
        .btn-select:hover { background: #334155; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>SuperCalc — Prateleira de Imóveis</h1>
            <p class="sub" id="txtContador">Carregando inventário do Supabase...</p>
        </div>
        <div class="view-toggle">
            <button class="view-btn active" id="btnViewCards" onclick="setMode('cards')">📑 Cartões</button>
            <button class="view-btn" id="btnViewTable" onclick="setMode('table')">📊 Tabela / Lista</button>
        </div>
    </header>

    <!-- PAINEL DE FILTROS COMPLETOS -->
    <div class="filters-card">
        <div>
            <label>Empreendimento:</label>
            <select id="filterEmp" onchange="renderUnits()">
                <option value="TODOS">Todos os Empreendimentos</option>
            </select>
        </div>
        <div>
            <label>Tipologia:</label>
            <select id="filterTipo" onchange="renderUnits()">
                <option value="TODOS">Todas as Tipologias</option>
                <option value="Studio">Studio</option>
                <option value="1 Dorm">1 Dormitório</option>
                <option value="2 Dorm">2 Dormitórios</option>
                <option value="3 Dorm">3 Dormitórios</option>
            </select>
        </div>
        <div>
            <label>Vagas de Garagem:</label>
            <select id="filterVagas" onchange="renderUnits()">
                <option value="TODOS">Todas as Opções</option>
                <option value="SEM">Sem Vaga (0)</option>
                <option value="COM">Com Vaga (1+)</option>
            </select>
        </div>
        <div>
            <label>Buscar por Unidade / M²:</label>
            <input type="text" id="filterBusca" placeholder="Ex: 501, 35m²..." oninput="renderUnits()">
        </div>
    </div>

    <!-- VISTA CARDS -->
    <div class="grid-units" id="containerCards"></div>

    <!-- VISTA TABELA -->
    <div class="table-container" id="containerTable">
        <table>
            <thead>
                <tr>
                    <th>Empreendimento</th>
                    <th>Unidade</th>
                    <th>Andar</th>
                    <th>Tipologia</th>
                    <th>Área</th>
                    <th>Vagas</th>
                    <th>Preço Tabela</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tbodyUnits"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://blzhzrctahvwaakxygzn.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsemh6cmN0YWh2d2Fha3h5Z3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjIyMjIsImV4cCI6MjEwNDYzODIyMn0.ENdprA6pZYce1BkjV5_frncWv_zqCq0XfoKfzF72JE0";

        let todasAsUnidades = [];
        let currentMode = 'cards';

        async function fetchUnidades() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/units?select=*,developments(title)&order=unit_number.asc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) throw new Error("Erro ao consultar o Supabase");
                
                const data = await response.json();
                todasAsUnidades = data.map(u => ({
                    emp: u.developments ? u.developments.title : 'NÃO INFORMADO',
                    unidade: u.unit_number,
                    andar: u.floor,
                    tipo: u.typology,
                    m2: u.private_area_m2,
                    vagas: u.parking_spaces || 0,
                    preco: parseFloat(u.list_price)
                }));

                populateEmpFilter();
                renderUnits();
            } catch (err) {
                console.error("Erro na comunicação com o Supabase:", err);
                document.getElementById("txtContador").innerText = "Erro ao carregar dados do Supabase. Verifique a conexão.";
            }
        }

        function populateEmpFilter() {
            const select = document.getElementById("filterEmp");
            const emps = [...new Set(todasAsUnidades.map(u => u.emp))];
            select.innerHTML = '<option value="TODOS">Todos os Empreendimentos</option>';
            emps.forEach(e => {
                select.innerHTML += `<option value="${e}">${e}</option>`;
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById("btnViewCards").className = mode === 'cards' ? 'view-btn active' : 'view-btn';
            document.getElementById("btnViewTable").className = mode === 'table' ? 'view-btn active' : 'view-btn';
            document.getElementById("containerCards").style.display = mode === 'cards' ? 'grid' : 'none';
            document.getElementById("containerTable").style.display = mode === 'table' ? 'block' : 'none';
            renderUnits();
        }

        function renderUnits() {
            const empFiltro = document.getElementById("filterEmp").value;
            const tipoFiltro = document.getElementById("filterTipo").value;
            const vagasFiltro = document.getElementById("filterVagas").value;
            const busca = document.getElementById("filterBusca").value.toLowerCase().trim();

            const filtrados = todasAsUnidades.filter(u => {
                const matchEmp = empFiltro === "TODOS" || u.emp === empFiltro;
                const matchTipo = tipoFiltro === "TODOS" || u.tipo.includes(tipoFiltro);
                const matchVagas = vagasFiltro === "TODOS" || (vagasFiltro === "COM" ? u.vagas > 0 : u.vagas === 0);
                const matchBusca = !busca || u.unidade.toLowerCase().includes(busca) || u.m2.toString().includes(busca);
                return matchEmp && matchTipo && matchVagas && matchBusca;
            });

            document.getElementById("txtContador").innerText = `${filtrados.length} unidades encontradas na base`;
            const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            if (currentMode === 'cards') {
                const container = document.getElementById("containerCards");
                container.innerHTML = "";
                if (filtrados.length === 0) {
                    container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 20px; color:#64748b;">Nenhuma unidade encontrada.</div>`;
                    return;
                }
                filtrados.forEach(u => {
                    container.innerHTML += `
                        <div class="unit-card">
                            <div>
                                <div class="unit-header">
                                    <span class="unit-title">Apto ${u.unidade}</span>
                                    <span class="unit-badge">${u.emp}</span>
                                </div>
                                <div class="unit-details">
                                    • Andar: <strong>${u.andar}º Pavimento</strong><br>
                                    • Tipologia: <strong>${u.tipo}</strong><br>
                                    • Área Privativa: <strong>${u.m2} m²</strong><br>
                                    • Vagas: <strong>${u.vagas > 0 ? u.vagas + ' Vaga(s)' : 'Sem Vaga'}</strong>
                                </div>
                            </div>
                            <div>
                                <div class="unit-price">${fmt(u.preco)}</div>
                                <button class="btn-select" style="width:100%" onclick="selecionarUnidade('${u.emp}', '${u.unidade}', ${u.andar}, ${u.preco}, '${u.tipo}', ${u.m2}, ${u.vagas})">Simular no SuperCalc →</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                const tbody = document.getElementById("tbodyUnits");
                tbody.innerHTML = "";
                if (filtrados.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Nenhuma unidade encontrada.</td></tr>`;
                    return;
                }
                filtrados.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${u.emp}</strong></td>
                            <td>Apto ${u.unidade}</td>
                            <td>${u.andar}º</td>
                            <td>${u.tipo}</td>
                            <td>${u.m2} m²</td>
                            <td>${u.vagas > 0 ? u.vagas : '0'}</td>
                            <td style="color:var(--success); font-weight:bold;">${fmt(u.preco)}</td>
                            <td><button class="btn-select" onclick="selecionarUnidade('${u.emp}', '${u.unidade}', ${u.andar}, ${u.preco}, '${u.tipo}', ${u.m2}, ${u.vagas})">Simular</button></td>
                        </tr>
                    `;
                });
            }
        }

        function selecionarUnidade(emp, unidade, andar, preco, tipo, m2, vagas) {
            const obj = {
                empreendimento: emp,
                unidade: unidade,
                andar: andar,
                precoTabela: preco,
                dorms: tipo,
                m2: m2,
                vagas: vagas,
                origem: 'GLOBAL'
            };
            localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(obj));
            window.location.href = "supercalc.html";
        }

        window.onload = fetchUnidades;
    </script>
</body>
</html>
