<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prateleira de Imoveis | SuperCalc</title>
    <link rel="icon" type="image/png" href="favicon supercalc energiaflix.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        th, td { white-space: nowrap; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- CABECALHO -->
    <header class="bg-slate-900 text-white p-3 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold flex items-center gap-2">
                    Prateleira de Imoveis
                    <span id="totalBadge" class="bg-blue-600 text-[11px] px-2 py-0.5 rounded-full font-semibold">0 Imoveis</span>
                </h1>
                <p class="text-[11px] text-slate-400">Estoque Unificado em Tempo Real</p>
            </div>
        </div>
    </header>

    <!-- BARRA DE FILTROS COMBINADOS -->
    <section class="max-w-7xl mx-auto p-2 md:p-4">
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
            <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Empreendimento</label>
                <select id="filtroEmpreendimento" onchange="filtrarEstoque()" class="w-full text-xs p-2 border border-slate-300 rounded bg-slate-50 focus:ring-1 focus:ring-blue-500 outline-none">
                    <option value="TODOS">Todos os Projetos</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Enquadramento</label>
                <select id="filtroIncome" onchange="filtrarEstoque()" class="w-full text-xs p-2 border border-slate-300 rounded bg-slate-50 focus:ring-1 focus:ring-blue-500 outline-none">
                    <option value="TODOS">Todos os Enquadramentos</option>
                    <option value="HIS">HIS (Interesse Social)</option>
                    <option value="HMP">HMP (Mercado Popular)</option>
                    <option value="R2V">R2V (Livre Mercado)</option>
                    <option value="NR">NR (Nao Residencial / Short Stay)</option>
                    <option value="LOJA">LOJA</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Metragem (m²)</label>
                <select id="filtroM2" onchange="filtrarEstoque()" class="w-full text-xs p-2 border border-slate-300 rounded bg-slate-50 focus:ring-1 focus:ring-blue-500 outline-none">
                    <option value="TODOS">Todas as Metragens</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">Buscar Unidade</label>
                <input type="text" id="filtroUnidade" onkeyup="filtrarEstoque()" placeholder="Ex: 1714, 501..." class="w-full text-xs p-2 border border-slate-300 rounded bg-slate-50 focus:ring-1 focus:ring-blue-500 outline-none">
            </div>

            <div class="flex items-end">
                <button onclick="limparFiltros()" class="w-full text-xs p-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded transition">Limpar Filtros</button>
            </div>
        </div>
    </section>

    <!-- TABELA EXCLUSIVA DE ALTA DENSIDADE -->
    <main class="max-w-7xl mx-auto p-2 md:p-4">
        <div id="loadingOverlay" class="p-8 text-center text-slate-500 font-semibold text-xs">Carregando estoque do banco de dados...</div>
        <div id="containerTabela" class="hidden overflow-x-auto bg-white rounded-lg shadow-sm border border-slate-200">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-900 text-white uppercase text-[10px] tracking-wider">
                    <tr>
                        <th class="p-2.5">Empreendimento</th>
                        <th class="p-2.5">Unidade</th>
                        <th class="p-2.5">Andar</th>
                        <th class="p-2.5">Enquadramento</th>
                        <th class="p-2.5">Metragem</th>
                        <th class="p-2.5">Valor Tabela</th>
                        <th class="p-2.5 text-center">Acao</th>
                    </tr>
                </thead>
                <tbody id="tbodyEstoque" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <script>
        let unidadesGlobais = [];

        window.onload = async () => {
            await carregarDadosSupabase();
        };

        async function carregarDadosSupabase() {
            try {
                const { data, error } = await _supabase
                    .from('units')
                    .select('*, developments(title, builder, address, is_ready)');

                if (error) throw error;

                if (data) {
                    unidadesGlobais = data.map(u => ({
                        id: u.id,
                        empreendimento: u.developments?.title || 'Empreendimento',
                        construtora: u.developments?.builder || 'AAM Incorporadora',
                        unidade: u.unit_number,
                        pavimento: parseInt(u.floor) || 0,
                        tipologia: u.typology,
                        income_type: u.income_type || 'R2V',
                        m2: parseFloat(u.private_area_m2) || 0,
                        vagas: u.parking_spaces || 0,
                        preco: parseFloat(u.list_price) || 0,
                        is_ready: u.developments?.is_ready || false,
                        val_ato: u.val_ato,
                        val_30_60_90: u.val_30_60_90,
                        qtd_mensais: u.qtd_mensais,
                        val_mensal_unit: u.val_mensal_unit,
                        qtd_anuais: u.qtd_anuais,
                        val_anual_unit: u.val_anual_unit,
                        val_chaves_unica: u.val_chaves_unica,
                        val_financiamento: u.val_financiamento
                    }));

                    popularDropdowns();
                    filtrarEstoque();
                }
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
                document.getElementById('loadingOverlay').innerText = "Erro ao carregar dados do banco. Verifique a conexao.";
            }
        }

        function popularDropdowns() {
            const selectEmp = document.getElementById('filtroEmpreendimento');
            const emps = [...new Set(unidadesGlobais.map(i => i.empreendimento))].sort();
            selectEmp.innerHTML = '<option value="TODOS">Todos os Projetos</option>' + 
                emps.map(e => `<option value="${e}">${e}</option>`).join('');

            const selectM2 = document.getElementById('filtroM2');
            const m2s = [...new Set(unidadesGlobais.map(i => i.m2))].sort((a,b) => a - b);
            selectM2.innerHTML = '<option value="TODOS">Todas as Metragens</option>' + 
                m2s.map(m => `<option value="${m}">${m} m²</option>`).join('');
        }

        function filtrarEstoque() {
            const emp = document.getElementById('filtroEmpreendimento').value;
            const income = document.getElementById('filtroIncome').value;
            const m2 = document.getElementById('filtroM2').value;
            const busq = document.getElementById('filtroUnidade').value.toLowerCase().trim();

            let filtrados = unidadesGlobais.filter(i => {
                const bateEmp = emp === 'TODOS' || i.empreendimento === emp;
                const bateIncome = income === 'TODOS' || i.income_type === income;
                const bateM2 = m2 === 'TODOS' || i.m2 == m2;
                const bateBusq = !busq || i.unidade.toLowerCase().includes(busq);
                return bateEmp && bateIncome && bateM2 && bateBusq;
            });

            // Ordenacao humana por andar e numero de unidade
            filtrados.sort((a, b) => {
                if (a.pavimento !== b.pavimento) return a.pavimento - b.pavimento;
                return a.unidade.localeCompare(b.unidade, undefined, { numeric: true, sensitivity: 'base' });
            });

            document.getElementById('totalBadge').innerText = `${filtrados.length} Imoveis`;
            renderizarTabela(filtrados);
        }

        function renderizarTabela(lista) {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('containerTabela').classList.remove('hidden');
            
            const tbody = document.getElementById('tbodyEstoque');

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500 font-bold">Nenhum imovel encontrado com os filtros selecionados.</td></tr>`;
                return;
            }

            tbody.innerHTML = lista.map(i => `
                <tr class="hover:bg-blue-50 transition">
                    <td class="p-2.5 font-bold text-slate-900">${i.empreendimento}</td>
                    <td class="p-2.5 font-semibold text-blue-600">${i.unidade}</td>
                    <td class="p-2.5">${i.pavimento}º Pav</td>
                    <td class="p-2.5"><span class="px-2 py-0.5 text-[10px] rounded font-bold ${getBadgeClass(i.income_type)}">${i.income_type}</span></td>
                    <td class="p-2.5">${i.m2} m²</td>
                    <td class="p-2.5 font-bold text-emerald-700">R$ ${i.preco.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    <td class="p-2.5 text-center">
                        <button onclick='simular("${i.id}")' class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded text-xs transition">Simular</button>
                    </td>
                </tr>
            `).join('');
        }

        function getBadgeClass(type) {
            switch(type) {
                case 'HIS': return 'bg-purple-100 text-purple-800';
                case 'HMP': return 'bg-orange-100 text-orange-800';
                case 'R2V': return 'bg-blue-100 text-blue-800';
                case 'NR':  return 'bg-pink-100 text-pink-800';
                case 'LOJA': return 'bg-amber-100 text-amber-800';
                default:    return 'bg-slate-100 text-slate-800';
            }
        }

        function simular(id) {
            const item = unidadesGlobais.find(i => i.id === id);
            if (!item) return;
            localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(item));
            window.location.href = "supercalc.html";
        }

        function limparFiltros() {
            document.getElementById('filtroEmpreendimento').value = 'TODOS';
            document.getElementById('filtroIncome').value = 'TODOS';
            document.getElementById('filtroM2').value = 'TODOS';
            document.getElementById('filtroUnidade').value = '';
            filtrarEstoque();
        }
    </script>
</body>
</html>
