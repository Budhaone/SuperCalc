<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prateleira de Imóveis - SuperCalc</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon supercalc energiaflix.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client & Configuração -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="bg-slate-100 font-sans p-1.5 md:p-4 text-slate-800">

    <!-- OVERLAY DE CARREGAMENTO -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white transition-opacity duration-300">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-amber-400 border-t-transparent mb-2"></div>
        <p class="font-bold text-xs md:text-sm text-amber-300">Carregando Prateleira de Imóveis...</p>
    </div>

    <div class="max-w-7xl mx-auto space-y-2.5">

        <!-- CABEÇALHO DO CATÁLOGO -->
        <header class="bg-slate-900 text-white p-3 md:p-4 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b-4 border-amber-400">
            <div>
                <h1 class="text-base md:text-xl font-black tracking-tight">PRATELEIRA DE IMÓVEIS</h1>
                <p class="text-[10px] md:text-xs text-amber-400 font-bold uppercase tracking-wider">Painel Multimarcas • Catálogo & Inventário Privado</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-between md:justify-end">
                <div class="flex items-center gap-1.5 text-xs font-bold">
                    <span class="px-2 py-0.5 bg-slate-800 text-slate-200 rounded-md border border-slate-700" id="badgeCountGlobal">🏷️ 0 Globais</span>
                    <span class="px-2 py-0.5 bg-amber-400/20 text-amber-300 rounded-md border border-amber-400/30" id="badgeCountPrivado">🔒 0 Privados</span>
                </div>
                <!-- BOTÃO DE CADASTRO DE IMÓVEL TERCEIROS / AVULSO -->
                <button onclick="abrirModalCadastro()" class="bg-purple-700 hover:bg-purple-600 text-white font-bold py-1.5 px-3 rounded-lg text-xs transition flex items-center gap-1 shadow-md">
                    ➕ Cadastrar Terceiros / Avulso
                </button>
            </div>
        </header>

        <!-- BARRA DE FILTROS COMPACTA -->
        <section class="bg-white p-2.5 md:p-4 rounded-xl shadow-sm border border-slate-200 space-y-2">
            <div class="flex justify-between items-center border-b pb-1">
                <h2 class="text-xs md:text-sm font-bold text-slate-900 uppercase tracking-wider">Filtros de Busca</h2>
                <button onclick="limparFiltros()" class="text-[11px] text-blue-600 font-bold hover:underline">Limpar Filtros</button>
            </div>

            <!-- GRADE COMPACTA DE FILTROS -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                <!-- 1. Incorporadora -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Incorporadora</label>
                    <select id="filtroConstrutora" onchange="atualizarEmpreendimentos(); filtrarEstoque();" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-medium bg-slate-50 focus:bg-white outline-none">
                        <option value="TODAS">Todas</option>
                        <option value="PRIVADO">🔒 Terceiros / Privado</option>
                    </select>
                </div>

                <!-- 2. Empreendimento -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Empreendimento</label>
                    <select id="filtroEmpreendimento" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-medium bg-slate-50 focus:bg-white outline-none">
                        <option value="TODOS">Todos</option>
                    </select>
                </div>

                <!-- 3. Tipo de Renda / Enquadramento -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Enquadramento</label>
                    <select id="filtroIncomeType" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-medium bg-slate-50 focus:bg-white outline-none">
                        <option value="TODOS">Todos</option>
                        <option value="HIS">HIS (Social)</option>
                        <option value="HMP">HMP (Popular)</option>
                        <option value="R2V">R2V (Residencial)</option>
                        <option value="NR">NR (Não Residencial)</option>
                    </select>
                </div>

                <!-- 4. Metragem -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Metragem (m²)</label>
                    <select id="filtroMetragem" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-medium bg-slate-50 focus:bg-white outline-none">
                        <option value="TODAS">Todas</option>
                    </select>
                </div>

                <!-- 5. Dormitórios -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Dormitórios</label>
                    <select id="filtroDorms" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-medium bg-slate-50 focus:bg-white outline-none">
                        <option value="TODOS">Todos</option>
                        <option value="0">Studio / Loft</option>
                        <option value="1">1 Dormitório</option>
                        <option value="2">2 Dormitórios</option>
                        <option value="3">3 Dormitórios</option>
                    </select>
                </div>

                <!-- 6. Vagas -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Vagas Garagem</label>
                    <select id="filtroVagas" onchange="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-medium bg-slate-50 focus:bg-white outline-none">
                        <option value="TODAS">Todas</option>
                        <option value="0">Sem vaga</option>
                        <option value="1">1 vaga</option>
                        <option value="2">2+ vagas</option>
                    </select>
                </div>

                <!-- 7. Preço Máximo -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Preço Máximo (R$)</label>
                    <input type="number" id="filtroPrecoMax" step="50000" placeholder="Ex: 600000" oninput="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-medium bg-slate-50 focus:bg-white outline-none">
                </div>

                <!-- 8. Busca por Unidade -->
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-0.5">Buscar Unidade</label>
                    <input type="text" id="filtroUnidade" placeholder="Ex: 510, 622..." oninput="filtrarEstoque()" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs font-bold bg-amber-50 focus:bg-white outline-none">
                </div>
            </div>
        </section>

        <!-- LISTA COMPACTA EM ESTRUTURA DE 3 COLUNAS POR CARTÃO -->
        <main class="space-y-2" id="containerEstoque">
            <!-- Renderizado dinamicamente -->
        </main>
    </div>

    <!-- MODAL DE CADASTRO DE IMÓVEIS TERCEIROS / AVULSO -->
    <div id="modalCadastro" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-4 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-slate-900 text-sm md:text-base uppercase">➕ Cadastrar Imóvel Terceiros / Avulso</h3>
                <button onclick="fecharModalCadastro()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">&times;</button>
            </div>

            <form id="formNovoImovel" onsubmit="salvarImovelPrivado(event)" class="space-y-2.5 text-xs md:text-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Empreendimento *</label>
                        <input type="text" id="addEmpreendimento" required placeholder="Ex: Sky Pinheiros" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Nº Unidade *</label>
                        <input type="text" id="addUnidade" required placeholder="Ex: 512" class="w-full border p-2 rounded-lg font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Área (m²) *</label>
                        <input type="number" id="addM2" step="0.1" required placeholder="Ex: 48.25" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Andar *</label>
                        <input type="number" id="addPavimento" required placeholder="Ex: 5" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Dormitórios *</label>
                        <input type="number" id="addDorms" min="0" required placeholder="Ex: 2" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Vagas *</label>
                        <input type="number" id="addVagas" min="0" required placeholder="Ex: 1" class="w-full border p-2 rounded-lg font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Enquadramento</label>
                        <select id="addIncomeType" class="w-full border p-2 rounded-lg font-medium bg-white">
                            <option value="R2V">R2V (Residencial Livre)</option>
                            <option value="HMP">HMP (Mercado Popular)</option>
                            <option value="HIS">HIS (Habitação Social)</option>
                            <option value="NR">NR (Não Residencial)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-0.5">Status da Obra</label>
                        <select id="addIsReady" class="w-full border p-2 rounded-lg font-medium bg-white">
                            <option value="false">🏗️ Em Construção</option>
                            <option value="true">🏠 Pronto para Morar</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-0.5">Preço Total de Venda (R$) *</label>
                    <input type="number" id="addPrecoTabela" step="1000" required placeholder="Ex: 550000" class="w-full border p-2 rounded-lg font-black text-base text-slate-900">
                </div>

                <div class="flex gap-2 pt-2 border-t">
                    <button type="button" onclick="fecharModalCadastro()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 rounded-xl transition">
                        Cancelar
                    </button>
                    <button type="submit" class="w-1/2 bg-purple-700 hover:bg-purple-600 text-white font-bold py-2 rounded-xl transition shadow-md">
                        💾 Salvar Terceiro
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT INTEGRAÇÃO SUPABASE E MAPEAMENTO CORRETO DOS EMPREENDIMENTOS -->
    <script>
        let ESTOQUE_GLOBAL = [];

        function obterClienteSupabase() {
            if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            if (typeof supabaseClient !== 'undefined' && supabaseClient) return supabaseClient;
            if (typeof window.supabase !== 'undefined' && window.supabase && typeof window.supabase.from === 'function') return window.supabase;
            if (typeof supabase !== 'undefined' && supabase && typeof supabase.from === 'function') return supabase;
            if (typeof window._supabase !== 'undefined' && window._supabase) return window._supabase;
            return null;
        }

        async function carregarEstoqueSupabase() {
            try {
                exibirLoading(true);

                const client = obterClienteSupabase();
                if (!client) {
                    console.error("Cliente Supabase não encontrado.");
                    alert("Atenção: A configuração do Supabase (supabase-config.js) não foi detectada.");
                    exibirLoading(false);
                    return;
                }

                // 1. Busca empreendimentos primeiro para mapear IDs UUID aos nomes reais (Sky, NOW, Poema, etc.)
                let devMap = {};
                try {
                    const { data: devsData } = await client.from('developments').select('*');
                    if (devsData && Array.isArray(devsData)) {
                        devsData.forEach(d => { 
                            if (d.id) devMap[d.id] = d; 
                        });
                    }
                } catch (e) {
                    console.warn("Aviso na consulta da tabela developments:", e);
                }

                // 2. Busca de unidades
                const { data: unitsData, error: unitsError } = await client.from('units').select('*');

                if (unitsError) {
                    console.error("Erro na busca de unidades do Supabase:", unitsError);
                    alert("Erro ao consultar o banco de dados: " + (unitsError.message || "Falha na conexão"));
                    exibirLoading(false);
                    return;
                }

                ESTOQUE_GLOBAL = (unitsData || []).map(u => {
                    // Mapeamento dinâmico sem forçar nome fixo
                    const dev = devMap[u.development_id] || {};
                    const empNome = u.development_name || u.empreendimento || u.emp || u.building || dev.name || dev.empreendimento || (u.is_third_party ? 'Imóvel Avulso / Terceiro' : 'Empreendimento');
                    const construtoraNome = u.builder || u.construtora || dev.builder || dev.construtora || (u.is_third_party ? 'PRIVADO / TERCEIROS' : 'AAM Incorporadora');

                    const precoVal = parseFloat(u.list_price || u.precoTabela || u.preco || 0);

                    return {
                        id: u.id,
                        empreendimento: empNome,
                        construtora: construtoraNome,
                        unidade: u.unit_number || u.unidade || '---',
                        m2: parseFloat(u.private_area_m2 || u.m2 || 0),
                        pavimento: u.floor || u.pavimento || 1,
                        dorms: u.dorms !== undefined && u.dorms !== null ? parseInt(u.dorms) : 1,
                        vagas: u.vagas !== undefined && u.vagas !== null ? parseInt(u.vagas) : 0,
                        tipologia: u.typology || u.tipologia || (u.dorms ? `${u.dorms} dorms` : 'Studio'),
                        income_type: u.income_type || u.enquadramento || 'R2V',
                        precoTabela: precoVal,
                        preco: precoVal,
                        is_ready: Boolean(u.is_ready),
                        is_third_party: Boolean(u.is_third_party),
                        
                        // Engenharia Financeira
                        val_ato: parseFloat(u.val_ato || 0),
                        val_30_60_90: parseFloat(u.val_30_60_90 || 0),
                        qtd_mensais: parseInt(u.qtd_mensais || 36),
                        val_mensal_unit: parseFloat(u.val_mensal_unit || 0),
                        qtd_anuais: parseInt(u.qtd_anuais || 3),
                        val_anual_unit: parseFloat(u.val_anual_unit || 0),
                        val_chaves_unica: parseFloat(u.val_chaves_unica || 0),
                        val_financiamento: parseFloat(u.val_financiamento || 0)
                    };
                });

                popularFiltroConstrutora();
                popularFiltroMetragem();
                atualizarEmpreendimentos();
                filtrarEstoque();

            } catch (err) {
                console.error("Erro no processamento:", err);
            } finally {
                exibirLoading(false);
            }
        }

        function popularFiltroConstrutora() {
            const select = document.getElementById("filtroConstrutora");
            const construtoras = [...new Set(ESTOQUE_GLOBAL.map(item => item.construtora))].sort();

            select.innerHTML = `<option value="TODAS">Todas</option>`;
            select.innerHTML += `<option value="PRIVADO">🔒 Terceiros / Privado</option>`;

            construtoras.forEach(c => {
                if (c !== 'PRIVADO / TERCEIROS') {
                    select.innerHTML += `<option value="${c}">${c}</option>`;
                }
            });
        }

        function popularFiltroMetragem() {
            const select = document.getElementById("filtroMetragem");
            const metragens = [...new Set(ESTOQUE_GLOBAL.map(item => item.m2).filter(m => m > 0))].sort((a, b) => a - b);

            select.innerHTML = `<option value="TODAS">Todas</option>`;
            metragens.forEach(m => {
                select.innerHTML += `<option value="${m}">${m.toFixed(2)} m²</option>`;
            });
        }

        function atualizarEmpreendimentos() {
            const construtoraSel = document.getElementById("filtroConstrutora").value;
            const selectEmp = document.getElementById("filtroEmpreendimento");

            let filtrados = ESTOQUE_GLOBAL;
            if (construtoraSel === "PRIVADO") {
                filtrados = ESTOQUE_GLOBAL.filter(i => i.is_third_party);
            } else if (construtoraSel !== "TODAS") {
                filtrados = ESTOQUE_GLOBAL.filter(i => i.construtora === construtoraSel);
            }

            const empreendimentos = [...new Set(filtrados.map(item => item.empreendimento))].sort();

            selectEmp.innerHTML = `<option value="TODOS">Todos</option>`;
            empreendimentos.forEach(e => {
                selectEmp.innerHTML += `<option value="${e}">${e}</option>`;
            });
        }

        function filtrarEstoque() {
            const construtoraSel = document.getElementById("filtroConstrutora").value;
            const empSel = document.getElementById("filtroEmpreendimento").value;
            const incomeSel = document.getElementById("filtroIncomeType").value;
            const m2Sel = document.getElementById("filtroMetragem").value;
            const dormsSel = document.getElementById("filtroDorms").value;
            const vagasSel = document.getElementById("filtroVagas").value;
            const precoMax = parseFloat(document.getElementById("filtroPrecoMax").value) || Infinity;
            const unidadeDigitada = document.getElementById("filtroUnidade").value.trim().toLowerCase();

            const resultado = ESTOQUE_GLOBAL.filter(item => {
                let matchConstrutora = construtoraSel === "TODAS" || (construtoraSel === "PRIVADO" ? item.is_third_party : item.construtora === construtoraSel);
                let matchEmp = empSel === "TODOS" || item.empreendimento === empSel;
                let matchIncome = incomeSel === "TODOS" || item.income_type === incomeSel;
                let matchM2 = m2Sel === "TODAS" || Math.abs(item.m2 - parseFloat(m2Sel)) < 0.05;

                let matchDorms = true;
                if (dormsSel === '0') matchDorms = (item.dorms === 0);
                else if (dormsSel === '1') matchDorms = (item.dorms === 1);
                else if (dormsSel === '2') matchDorms = (item.dorms === 2);
                else if (dormsSel === '3') matchDorms = (item.dorms >= 3);

                let matchVagas = true;
                if (vagasSel === '0') matchVagas = (item.vagas === 0);
                else if (vagasSel === '1') matchVagas = (item.vagas === 1);
                else if (vagasSel === '2') matchVagas = (item.vagas >= 2);

                let matchPreco = item.precoTabela <= precoMax;
                let matchUnidade = !unidadeDigitada || item.unidade.toLowerCase().includes(unidadeDigitada);

                return matchConstrutora && matchEmp && matchIncome && matchM2 && matchDorms && matchVagas && matchPreco && matchUnidade;
            });

            renderizarListaFormatada(resultado);
            atualizarBadgesContagem(resultado);
        }

        function renderizarListaFormatada(lista) {
            const container = document.getElementById("containerEstoque");
            container.innerHTML = "";

            if (lista.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-xl text-center text-slate-500 border border-slate-200">
                        <p class="font-bold text-sm">Nenhuma unidade encontrada.</p>
                        <p class="text-xs mt-1 text-slate-400">Ajuste os filtros de busca acima.</p>
                    </div>`;
                return;
            }

            const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            lista.forEach(item => {
                const valM2 = item.m2 > 0 ? (item.precoTabela / item.m2) : 0;
                const isReady = item.is_ready;

                const card = document.createElement("div");
                card.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm hover:border-slate-400 transition grid grid-cols-1 md:grid-cols-12 items-center gap-3 text-xs md:text-sm";

                card.innerHTML = `
                    <!-- COLUNA 1: RESUMO DA UNIDADE (SEM CONSTRUTORA) -->
                    <div class="md:col-span-6 space-y-0.5">
                        <div class="font-black text-slate-900 text-sm md:text-base">${item.empreendimento}</div>
                        <div class="text-slate-600 font-medium flex flex-wrap items-center gap-1.5 text-[11px] md:text-xs">
                            <span class="text-amber-600 font-black">Apto ${item.unidade}</span>
                            <span class="text-slate-300">•</span>
                            <span class="font-bold text-slate-800">${item.m2} m²</span>
                            <span class="text-slate-300">•</span>
                            <span class="text-slate-500">${item.pavimento}º Andar</span>
                            <span class="text-slate-300">•</span>
                            <span class="text-slate-500">${item.tipologia}</span>
                        </div>
                    </div>

                    <!-- COLUNA 2: STATUS, TIPO DE RENDA E VALORES DE TABELA / M² -->
                    <div class="md:col-span-4 flex flex-col justify-center space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="inline-block px-2 py-0.5 rounded text-[10px] md:text-xs font-black uppercase ${isReady ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-blue-100 text-blue-800 border border-blue-200'}">
                                ${isReady ? '🏠 PRONTO PARA MORAR' : '🏗️ EM CONSTRUÇÃO'}
                            </span>
                            <span class="bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded text-[10px] md:text-xs font-black uppercase border border-amber-200">
                                ${item.income_type}
                            </span>
                        </div>
                        <div class="flex items-baseline gap-2">
                            <span class="text-sm md:text-base font-black text-slate-900">${fmt(item.precoTabela)}</span>
                            <span class="text-[10px] md:text-xs text-emerald-600 font-bold">(${fmt(valM2)}/m²)</span>
                        </div>
                    </div>

                    <!-- COLUNA 3: BOTÃO DE SIMULAR -->
                    <div class="md:col-span-2">
                        <button onclick="enviarParaSuperCalc('${item.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-3 rounded-lg text-xs md:text-sm transition shadow-sm flex items-center justify-center gap-1">
                            ⚡ Simular
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function atualizarBadgesContagem(listaFiltrada) {
            const globais = listaFiltrada.filter(i => !i.is_third_party).length;
            const privados = listaFiltrada.filter(i => i.is_third_party).length;

            document.getElementById("badgeCountGlobal").innerText = `🏷️ ${globais} Globais`;
            document.getElementById("badgeCountPrivado").innerText = `🔒 ${privados} Privados`;
        }

        function enviarParaSuperCalc(id) {
            const item = ESTOQUE_GLOBAL.find(i => i.id === id);
            if (!item) return;

            localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(item));
            window.location.href = "supercalc.html";
        }

        function limparFiltros() {
            document.getElementById("filtroConstrutora").value = "TODAS";
            document.getElementById("filtroEmpreendimento").value = "TODOS";
            document.getElementById("filtroIncomeType").value = "TODOS";
            document.getElementById("filtroMetragem").value = "TODAS";
            document.getElementById("filtroDorms").value = "TODOS";
            document.getElementById("filtroVagas").value = "TODAS";
            document.getElementById("filtroPrecoMax").value = "";
            document.getElementById("filtroUnidade").value = "";
            filtrarEstoque();
        }

        function abrirModalCadastro() {
            document.getElementById("modalCadastro").classList.remove("hidden");
        }

        function fecharModalCadastro() {
            document.getElementById("modalCadastro").classList.add("hidden");
            document.getElementById("formNovoImovel").reset();
        }

        async function salvarImovelPrivado(e) {
            e.preventDefault();

            const client = obterClienteSupabase();
            if (!client) {
                alert("Erro ao conectar com o Supabase.");
                return;
            }

            const novoItem = {
                development_name: document.getElementById("addEmpreendimento").value.trim(),
                unit_number: document.getElementById("addUnidade").value.trim(),
                private_area_m2: parseFloat(document.getElementById("addM2").value),
                floor: parseInt(document.getElementById("addPavimento").value),
                dorms: parseInt(document.getElementById("addDorms").value),
                vagas: parseInt(document.getElementById("addVagas").value),
                income_type: document.getElementById("addIncomeType").value,
                is_ready: document.getElementById("addIsReady").value === "true",
                list_price: parseFloat(document.getElementById("addPrecoTabela").value),
                builder: "PRIVADO / TERCEIROS",
                is_third_party: true
            };

            exibirLoading(true);

            const { data, error } = await client.from('units').insert([novoItem]).select();

            exibirLoading(false);

            if (error) {
                console.error("Erro ao salvar imóvel privado:", error);
                alert("Erro ao cadastrar imóvel no Supabase.");
                return;
            }

            alert("Imóvel de terceiro cadastrado com sucesso!");
            fecharModalCadastro();
            carregarEstoqueSupabase();
        }

        function exibirLoading(exibir) {
            const overlay = document.getElementById("loadingOverlay");
            if (exibir) {
                overlay.classList.remove("hidden");
            } else {
                overlay.classList.add("hidden");
            }
        }

        // Execução ao carregar a página
        if (document.readyState === "loading") {
            window.addEventListener("DOMContentLoaded", carregarEstoqueSupabase);
        } else {
            carregarEstoqueSupabase();
        }
    </script>
</body>
</html>
