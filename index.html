<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prateleira | SuperCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen pb-12">

    <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto space-y-3">
            <div class="flex justify-between items-center">
                <h1 class="text-base font-black text-amber-400 uppercase tracking-wider">Prateleira de Imóveis</h1>
                <span id="badgeContador" class="bg-amber-400 text-slate-900 text-xs font-black px-3 py-1 rounded">0 Imóveis</span>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <select id="filtroEmpreendimento" onchange="filtrarEstoque()" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-bold outline-none focus:border-amber-400">
                    <option value="TODOS">Todos os Empreendimentos</option>
                </select>
                <select id="selOrdenacao" onchange="filtrarEstoque()" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-bold outline-none focus:border-amber-400">
                    <option value="andar_desc">Andar (Mais Alto)</option>
                    <option value="preco_asc">Menor Preço</option>
                    <option value="preco_desc">Maior Preço</option>
                    <option value="m2_asc">Menor m²</option>
                </select>
                <input type="text" id="filtroTexto" onkeyup="filtrarEstoque()" placeholder="Buscar Apto..." class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-bold outline-none focus:border-amber-400 text-white placeholder-slate-500">
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="loading" class="py-12 text-center text-slate-400 text-xs font-bold">Buscando unidades na nuvem...</div>
        <div id="listaImoveis" class="space-y-2 hidden"></div>
    </main>

    <script>
        let unidadesGlobais = [];

        window.onload = async () => { await carregarDadosSupabase(); };

        async function carregarDadosSupabase() {
            try {
                // FILTRO RÍGIDO: Traz EXCLUSIVAMENTE o que for DISPONIVEL
                const { data, error } = await _supabase
                    .from('units')
                    .select('*, developments(*)')
                    .eq('status', 'DISPONIVEL'); // Oculta qualquer unidade com status diferente de DISPONIVEL

                if (error) throw error;

                if (data) {
                    unidadesGlobais = data.map(u => ({
                        id: u.id,
                        empreendimento: u.developments?.title || "Empreendimento",
                        unidade: String(u.unit_number || "---"),
                        pavimento: parseInt(u.floor) || 1,
                        tipologia: u.typology || "Studio",
                        income_type: u.income_type || "R2V",
                        m2: parseFloat(u.private_area_m2) || 0,
                        precoTabela: parseFloat(u.list_price) || 0,
                        is_ready: u.developments?.is_ready || false,
                        val_ato: parseFloat(u.val_ato) || 0,
                        qtd_mensais: parseInt(u.qtd_mensais) || 0,
                        val_mensal_unit: parseFloat(u.val_mensal_unit) || 0,
                        qtd_anuais: parseInt(u.qtd_anuais) || 0,
                        val_anual_unit: parseFloat(u.val_anual_unit) || 0,
                        val_chaves_unica: parseFloat(u.val_chaves_unica) || 0,
                        val_financiamento: parseFloat(u.val_financiamento) || 0
                    }));
                }
                atualizarEmpreendimentos();
                filtrarEstoque();
            } catch (err) {
                document.getElementById('loading').innerHTML = `<p class="text-red-400">Erro ao carregar dados do banco.</p>`;
            }
        }

        function atualizarEmpreendimentos() {
            const selectEmp = document.getElementById("filtroEmpreendimento");
            const empreendimentosUnicos = [...new Set(unidadesGlobais.map(u => u.empreendimento))].sort();
            selectEmp.innerHTML = '<option value="TODOS">Todos os Empreendimentos</option>' + 
                empreendimentosUnicos.map(e => `<option value="${e}">${e}</option>`).join('');
        }

        function filtrarEstoque() {
            const empreendimento = document.getElementById("filtroEmpreendimento").value;
            const ordenacao = document.getElementById("selOrdenacao").value;
            const texto = document.getElementById("filtroTexto").value.toLowerCase().trim();

            const filtrados = unidadesGlobais.filter(u => {
                const bateEmpreendimento = empreendimento === "TODOS" || u.empreendimento === empreendimento;
                const bateTexto = !texto || u.unidade.toLowerCase().includes(texto) || u.empreendimento.toLowerCase().includes(texto);
                return bateEmpreendimento && bateTexto;
            });

            if (ordenacao === "andar_desc") filtrados.sort((a,b) => b.pavimento - a.pavimento);
            if (ordenacao === "preco_asc") filtrados.sort((a,b) => a.precoTabela - b.precoTabela);
            if (ordenacao === "preco_desc") filtrados.sort((a,b) => b.precoTabela - a.precoTabela);
            if (ordenacao === "m2_asc") filtrados.sort((a,b) => a.m2 - b.m2);

            document.getElementById("badgeContador").innerText = `${filtrados.length} Imóveis`;
            document.getElementById("loading").classList.add("hidden");
            
            const container = document.getElementById("listaImoveis");
            container.classList.remove("hidden");

            if(filtrados.length === 0) {
                container.innerHTML = `<div class="text-center p-8 text-slate-500 font-bold bg-slate-800 rounded-xl border border-slate-700">Nenhum imóvel disponível encontrado.</div>`;
                return;
            }

            container.innerHTML = filtrados.map(u => `
                <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 shadow flex justify-between items-center">
                    <div>
                        <h3 class="text-sm font-black text-white">${u.empreendimento}</h3>
                        <p class="text-xs text-slate-400">Apto <strong>${u.unidade}</strong> • ${u.m2} m² • ${u.pavimento}º Andar • ${u.tipologia}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400 uppercase font-bold">Valor Tabela</p>
                            <p class="text-sm font-black text-amber-400">R$ ${u.precoTabela.toLocaleString('pt-BR', {minimumFractionDigits:2})}</p>
                        </div>
                        <button onclick="simular('${u.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition">Simular</button>
                    </div>
                </div>
            `).join('');
        }

        function simular(id) {
            const u = unidadesGlobais.find(item => item.id === id);
            if(u) {
                localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(u));
                window.location.href = "supercalc.html";
            }
        }
    </script>
</body>
</html>
