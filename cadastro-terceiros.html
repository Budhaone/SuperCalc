<script>
        // MÁSCARA MONETÁRIA BRL
        function mascaraMoeda(campo) {
            let valor = campo.value.replace(/\D/g, '');
            if (!valor) { campo.value = ''; return; }
            valor = (parseFloat(valor) / 100).toFixed(2);
            valor = valor.replace('.', ',');
            valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
            campo.value = 'R$ ' + valor;
        }

        function parseMoeda(str) {
            if (!str) return 0;
            return parseFloat(str.replace('R$', '').replace(/\./g, '').replace(',', '.').trim()) || 0;
        }

        function alternarEstagioObra() {
            const isObra = document.querySelector('input[name="radioEstagio"]:checked').value === 'OBRA';
            document.getElementById("painelFluxoObra").classList.toggle("hidden", !isObra);
        }

        function tratarSelecaoEmpreendimento() {
            const val = document.getElementById("selectEmpreendimento").value;
            document.getElementById("boxOutroEmp").classList.toggle("hidden", val !== 'OUTRO');
        }

        function calcularComissao() {
            const total = parseMoeda(document.getElementById("inputPrecoTotal").value);
            const comissaoPct = parseFloat(document.getElementById("inputComissaoPct").value) || 6.00;
            const isGrossUp = document.getElementById("chkGrossUp").checked;

            let valorLiquido = 0;
            if (isGrossUp) {
                valorLiquido = total; // O preço digitado já é o líquido pretendido
            } else {
                valorLiquido = total * (1 - (comissaoPct / 100)); // Desmembra os 6% do valor cheio
            }

            document.getElementById("lblLiquidoProprietario").innerText = valorLiquido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        async function salvarEEnviar(e) {
            e.preventDefault();

            const selectEmp = document.getElementById("selectEmpreendimento").value;
            let empSlug = selectEmp;
            let empTitle = selectEmp;

            // Formata o Slug e Título caso seja um prédio novo
            if (selectEmp === 'OUTRO') {
                empTitle = document.getElementById("inputOutroEmp").value.trim();
                // Converte "Mansão Jardins" para "mansao-jardins"
                empSlug = empTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-');
            }
            
            const isObra = document.querySelector('input[name="radioEstagio"]:checked').value === 'OBRA';
            const precoTotal = parseMoeda(document.getElementById("inputPrecoTotal").value);
            const numUnidade = document.getElementById("inputUnidade").value.trim();

            if (!precoTotal || !numUnidade) {
                alert("Por favor, preencha o número da unidade e o valor total de venda.");
                return;
            }

            // ENGENHARIA FINANCEIRA: PRONTO VS OBRA
            let valAto = 0, valFinanciamento = 0;
            if (!isObra) {
                valAto = precoTotal * 0.30;
                valFinanciamento = precoTotal * 0.70;
            } else {
                valAto = parseMoeda(document.getElementById("inputValAto").value);
                valFinanciamento = parseMoeda(document.getElementById("inputValFinanciamento").value);
            }

            const payloadUnidade = {
                development_id: empSlug,
                empreendimento: selectEmp === 'OUTRO' ? empTitle : selectEmp.toUpperCase(),
                unidade: numUnidade,
                unit_number: numUnidade,
                floor: parseInt(document.getElementById("inputAndar").value) || 1,
                typology: document.getElementById("selectTipologia").value,
                income_type: document.getElementById("selectIncomeType").value,
                status: 'DISPONIVEL',
                precoTabela: precoTotal,
                list_price: precoTotal,
                private_area_m2: parseFloat(document.getElementById("inputM2").value) || 30.00,
                m2: parseFloat(document.getElementById("inputM2").value) || 30.00,
                parking_spaces: parseInt(document.getElementById("inputVagas").value) || 0,
                is_ready: !isObra,
                is_third_party: true,
                is_exclusive: document.getElementById("chkExclusividade").checked,
                
                val_ato: valAto,
                val_30_60_90: parseMoeda(document.getElementById("inputVal306090").value),
                qtd_mensais: parseInt(document.getElementById("inputQtdMensais").value) || 0,
                val_mensal_unit: parseMoeda(document.getElementById("inputValMensal").value),
                qtd_anuais: parseInt(document.getElementById("inputQtdAnuais").value) || 0,
                val_anual_unit: parseMoeda(document.getElementById("inputValAnual").value),
                val_periodicidade: parseMoeda(document.getElementById("inputValPeriodicidade").value),
                val_chaves_unica: parseMoeda(document.getElementById("inputValChaves").value),
                val_financiamento: valFinanciamento,
                data_entrega: document.getElementById("inputDataEntrega").value || ''
            };

            // 1. SALVA NA MEMÓRIA DO NAVEGADOR PARA SUPERCALC
            localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(payloadUnidade));

            // 2. GRAVAÇÃO SEGURA NO SUPABASE
            if (typeof _supabase !== 'undefined' && _supabase) {
                try {
                    // PASSO A: Cadastra o Prédio Novo antes da Unidade (Impede Erro 23503 FK Constraint)
                    if (selectEmp === 'OUTRO') {
                        const { error: devError } = await _supabase.from('developments').upsert([{
                            id: empSlug,
                            title: empTitle,
                            builder: 'Particular / Terceiros',
                            is_third_party: true
                        }]);
                        if (devError) throw devError;
                    }

                    // PASSO B: Cadastra a Unidade
                    const { error: unitError } = await _supabase.from('units').insert([{
                        development_id: empSlug,
                        unit_number: payloadUnidade.unit_number,
                        floor: payloadUnidade.floor,
                        typology: payloadUnidade.typology,
                        income_type: payloadUnidade.income_type,
                        status: 'DISPONIVEL',
                        list_price: payloadUnidade.list_price,
                        private_area_m2: payloadUnidade.private_area_m2,
                        parking_spaces: payloadUnidade.parking_spaces,
                        val_ato: payloadUnidade.val_ato,
                        val_30_60_90: payloadUnidade.val_30_60_90,
                        qtd_mensais: payloadUnidade.qtd_mensais,
                        val_mensal_unit: payloadUnidade.val_mensal_unit,
                        qtd_anuais: payloadUnidade.qtd_anuais,
                        val_anual_unit: payloadUnidade.val_anual_unit,
                        val_periodicidade: payloadUnidade.val_periodicidade,
                        val_chaves_unica: payloadUnidade.val_chaves_unica,
                        val_financiamento: payloadUnidade.val_financiamento,
                        is_third_party: true,
                        is_exclusive: payloadUnidade.is_exclusive,
                        commission_rate: parseFloat(document.getElementById("inputComissaoPct").value) || 6.00,
                        net_owner_value: parseMoeda(document.getElementById("lblLiquidoProprietario").innerText)
                    }]);
                    
                    if (unitError) throw unitError;

                } catch (err) {
                    console.error("Erro Supabase:", err);
                    alert("Erro de segurança no banco de dados: " + (err.message || "Verifique a conexão."));
                    return; // Aborta e não muda de tela se falhar
                }
            }

            // 3. SE SUCESSO, REDIRECIONA PARA A PRATELEIRA OU SUPERCALC
            window.location.href = "index.html";
        }
    </script>
