<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captação de Imóveis • Envio de Unidade</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-3 md:p-6 text-slate-800">

    <div class="max-w-2xl mx-auto space-y-6">

        <!-- CABEÇALHO ISOLADO (SEM BOTÃO DE VOLTAR PARA A PRATELEIRA) -->
        <header class="bg-slate-900 text-white p-5 rounded-2xl shadow-md border-b-4 border-purple-500 text-center">
            <h1 class="text-lg md:text-xl font-black tracking-tight">FORMULÁRIO DE CADASTRO DE IMÓVEL</h1>
            <p class="text-xs text-purple-300 font-medium">Envio Seguro de Informações e Captação</p>
        </header>

        <!-- FORMULÁRIO DE CAPTAÇÃO -->
        <main id="boxFormulario" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 text-xs">
            <form id="formCaptacao" onsubmit="processarEnvio(event)" class="space-y-4">
                
                <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 flex justify-between items-center">
                    <label for="addExclusivo" class="font-bold text-amber-900 cursor-pointer">⭐ CONTRATO COM EXCLUSIVIDADE DE VENDA?</label>
                    <input type="checkbox" id="addExclusivo" class="w-5 h-5 accent-amber-600 cursor-pointer">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Nome do Imóvel / Condomínio</label>
                        <input type="text" id="addEmpreendimento" required placeholder="Ex: Casa Jd. Guedala" class="w-full border p-2.5 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Proprietário / Responsável</label>
                        <input type="text" id="addConstrutora" required placeholder="Ex: Sr. Marcos" class="w-full border p-2.5 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Bairro / Região</label>
                        <input type="text" id="addBairro" required placeholder="Ex: Jd. Guedala" class="w-full border p-2.5 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Unidade / Número</label>
                        <input type="text" id="addUnidade" required placeholder="Ex: Casa 5" class="w-full border p-2.5 rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Área (m²)</label>
                        <input type="number" id="addM2" step="0.1" required placeholder="120" class="w-full border p-2 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Andar / Pav.</label>
                        <input type="number" id="addPavimento" value="1" min="0" required class="w-full border p-2 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Dormitórios</label>
                        <input type="number" id="addDorms" value="3" min="0" required class="w-full border p-2 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Suítes</label>
                        <input type="number" id="addSuites" value="1" min="0" required class="w-full border p-2 rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Vagas Garagem</label>
                        <input type="number" id="addVagas" value="2" min="0" required class="w-full border p-2.5 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Depósito Privativo?</label>
                        <select id="addDeposito" class="w-full border p-2.5 rounded-lg bg-white">
                            <option value="false">Não possui</option>
                            <option value="true" selected>Sim, possui</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Previsão Entrega</label>
                        <input type="month" id="addEntrega" value="2027-12" required class="w-full border p-2.5 rounded-lg bg-white">
                    </div>
                </div>

                <!-- ENGENHARIA FINANCEIRA CRECI -->
                <div class="bg-purple-50 p-4 rounded-xl border border-purple-200 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="font-bold text-purple-900">VALOR E COMISSIONAMENTO</label>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold text-purple-700 uppercase">% Comissão:</span>
                            <input type="number" id="addPctComissao" value="6.0" step="0.5" oninput="calcularEngenharia()" class="w-16 border p-1 rounded font-bold text-center bg-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Tipo de Entrada</label>
                            <select id="addTipoPreco" onchange="calcularEngenharia()" class="w-full border p-2 rounded-lg bg-white">
                                <option value="LIQUIDO">Valor Líquido Pretendido</option>
                                <option value="BRUTO">Valor Bruto Anunciado</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Valor Digitado (R$)</label>
                            <input type="text" id="addInputPreco" required value="R$ 1.000.000,00" oninput="tratarMoeda(this)" class="w-full border-2 border-purple-400 p-2 rounded-lg font-black text-base text-right bg-white outline-none">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-purple-700 hover:bg-purple-600 text-white font-bold py-3.5 rounded-xl transition shadow-md text-sm">
                    💾 Enviar Cadastro para Análise
                </button>
            </form>
        </main>

        <!-- TELA DE COMPROVANTE E REVISÃO (EXIBIDA APÓS O ENVIO) -->
        <section id="boxComprovante" class="hidden bg-white p-6 rounded-2xl shadow-xl border-2 border-emerald-500 space-y-4 text-xs">
            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-center space-y-1">
                <span class="text-3xl">✅</span>
                <h2 class="text-base font-black text-emerald-900">CADASTRO REALIZADO COM SUCESSO!</h2>
                <p class="text-slate-600">As informações do imóvel foram registradas no sistema. Confira o resumo abaixo:</p>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2" id="resumoComprovante">
                <!-- Preenchido via JS -->
            </div>

            <button onclick="novoCadastro()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition text-xs">
                ➕ Cadastrar Outro Imóvel
            </button>
        </section>

    </div>

    <script>
        function parseMoedaFloat(v) {
            if (!v) return 0;
            let num = v.toString().replace(/\D/g, "");
            return num ? parseFloat(num) / 100 : 0;
        }

        function fmtBRL(v) {
            return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function tratarMoeda(input) {
            input.value = fmtBRL(parseMoedaFloat(input.value));
            calcularEngenharia();
        }

        function calcularEngenharia() {
            const inputVal = parseMoedaFloat(document.getElementById("addInputPreco").value);
            const tipo = document.getElementById("addTipoPreco").value;
            const pct = (parseFloat(document.getElementById("addPctComissao").value) || 6) / 100;

            let tabela = tipo === "LIQUIDO" ? (inputVal / (1 - pct)) : inputVal;
            let comissao = tipo === "LIQUIDO" ? (tabela - inputVal) : (inputVal * pct);
            let liquido = tipo === "LIQUIDO" ? inputVal : (inputVal - comissao);

            return { tabela, comissao, liquido, pct: pct * 100 };
        }

        function processarEnvio(e) {
            e.preventDefault();
            const eng = calcularEngenharia();

            const imovel = {
                id: "PRIV_" + Date.now(),
                origem: "PRIVADO",
                construtora: document.getElementById("addConstrutora").value.trim(),
                empreendimento: document.getElementById("addEmpreendimento").value.trim(),
                bairro: document.getElementById("addBairro").value.trim(),
                unidade: document.getElementById("addUnidade").value.trim(),
                pavimento: parseInt(document.getElementById("addPavimento").value) || 1,
                dorms: parseInt(document.getElementById("addDorms").value) || 0,
                suites: parseInt(document.getElementById("addSuites").value) || 0,
                vagas: parseInt(document.getElementById("addVagas").value) || 0,
                deposito: document.getElementById("addDeposito").value === "true",
                m2: parseFloat(document.getElementById("addM2").value) || 0,
                precoTabela: eng.tabela,
                valorComissao: eng.comissao,
                valorLiquido: eng.liquido,
                pctComissao: eng.pct,
                ehExclusivo: document.getElementById("addExclusivo").checked,
                entregaObra: document.getElementById("addEntrega").value
            };

            // Salva no banco local
            const existentes = JSON.parse(localStorage.getItem("IMOVEIS_PRIVADOS") || "[]");
            existentes.unshift(imovel);
            localStorage.setItem("IMOVEIS_PRIVADOS", JSON.stringify(existentes));

            // Exibe o Comprovante de Revisão
            document.getElementById("resumoComprovante").innerHTML = `
                <div class="border-b pb-2 mb-2 font-bold text-slate-900 text-sm">
                    ${imovel.empreendimento} — Unidade ${imovel.unidade} ${imovel.ehExclusivo ? '⭐ (Exclusivo)' : ''}
                </div>
                <div><strong>Proprietário/Resp:</strong> ${imovel.construtora}</div>
                <div><strong>Localização:</strong> ${imovel.bairro}</div>
                <div><strong>Especificações:</strong> ${imovel.m2} m² • ${imovel.dorms}d (${imovel.suites}s) • ${imovel.vagas}v</div>
                <div class="pt-2 border-t grid grid-cols-2 gap-2 font-bold">
                    <div>Preço Anúncio: <span class="text-purple-700">${fmtBRL(imovel.precoTabela)}</span></div>
                    <div>Repasse Líquido: <span class="text-emerald-700">${fmtBRL(imovel.valorLiquido)}</span></div>
                </div>
            `;

            document.getElementById("boxFormulario").classList.add("hidden");
            document.getElementById("boxComprovante").classList.remove("hidden");
        }

        function novoCadastro() {
            document.getElementById("formCaptacao").reset();
            document.getElementById("addInputPreco").value = "R$ 1.000.000,00";
            document.getElementById("boxComprovante").classList.add("hidden");
            document.getElementById("boxFormulario").classList.remove("hidden");
        }
    </script>
</body>
</html>
