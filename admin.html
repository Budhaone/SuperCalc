<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Estoque | SuperCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        .unit-card {
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
        }
        .unit-card:active { transform: scale(0.92); }
        .disp { background-color: #dcfce7; color: #166534; border: 1px solid #22c55e; }
        .promo { background-color: #dbeafe; color: #1e3a8a; border: 1px solid #3b82f6; }
        .trava { background-color: #fee2e2; color: #991b1b; border: 1px solid #ef4444; text-decoration: line-through; }
        
        .btn-fab-save {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            border-radius: 50%; background: #10b981; color: white; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid white; z-index: 50;
            cursor: pointer; transition: transform 0.2s ease, background 0.2s ease;
        }
        .btn-fab-save:active { transform: scale(0.9); }
        .btn-fab-save.pendente { background: #f59e0b; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen pb-24">

    <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-6xl mx-auto space-y-3">
            <h1 class="text-xl font-black text-amber-400">⚙️ Gestor de Estoque (Rascunho Local)</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <select id="selEmpreendimento" onchange="carregarEmpreendimento()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm font-bold outline-none focus:border-amber-400">
                    <option value="">Carregando Empreendimentos...</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="definirModo('TRAVA')" id="btnModoTrava" class="flex-1 bg-red-900/50 text-red-400 border border-red-700 rounded-xl text-xs font-bold transition">🔴 Alternar Trava</button>
                    <button onclick="definirModo('PROMO')" id="btnModoPromo" class="flex-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-xl text-xs font-bold transition">🔵 Alternar Promo</button>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 pt-2">
                <button onclick="abrirModalReset()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-lg text-xs font-bold transition shadow">🔄 Limpezas e Resets...</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="loading" class="py-12 text-center text-slate-400 font-bold text-sm hidden">
            Carregando estrutura...
        </div>
        <div id="matriz" class="bg-slate-100 p-4 rounded-xl overflow-x-auto shadow-inner min-h-[300px]">
            <p class="text-slate-500 text-center font-bold mt-10">Selecione um empreendimento acima para visualizar a matriz.</p>
        </div>
    </main>

    <button id="btnSalvar" class="btn-fab-save" onclick="salvarAlteracoes()" title="Salvar e Publicar">💾</button>

    <!-- Modal de Resets -->
    <div id="modalReset" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-5 max-w-sm w-full space-y-3 shadow-2xl text-center">
            <h3 class="text-lg font-black text-amber-400 mb-2">Opções de Limpeza</h3>
            <button onclick="executarLimpeza('TRAVAS')" class="w-full bg-slate-800 hover:bg-slate-700 border border-red-900 text-red-400 font-bold py-2 rounded-lg transition text-sm">
                Remover TODAS as Travas
            </button>
            <button onclick="executarLimpeza('PROMOS')" class="w-full bg-slate-800 hover:bg-slate-700 border border-blue-900 text-blue-400 font-bold py-2 rounded-lg transition text-sm">
                Remover TODAS as Promoções
            </button>
            <button onclick="executarLimpeza('TUDO')" class="w-full bg-red-900 hover:bg-red-800 border border-red-700 text-white font-bold py-2 rounded-lg transition text-sm">
                ⚠️ Tornar Tudo Disponível
            </button>
            <button onclick="fecharModal()" class="w-full bg-slate-700 text-white font-bold py-2 rounded-lg mt-2 text-sm">
                Cancelar
            </button>
        </div>
    </div>

    <script>
        let unidadesGlobal = [];
        let rascunhoStatus = {}; 
        let modoAtual = 'TRAVA';
        let idEmpreendimentoAtual = null;

        window.onload = async () => {
            await listarEmpreendimentos();
        };

        async function listarEmpreendimentos() {
            const { data, error } = await _supabase.from('developments').select('id, title').order('title');
            if (data) {
                const sel = document.getElementById("selEmpreendimento");
                sel.innerHTML = '<option value="">Selecione um Empreendimento...</option>' + 
                    data.map(d => `<option value="${d.id}">${d.title}</option>`).join('');
            }
        }

        async function carregarEmpreendimento() {
            idEmpreendimentoAtual = document.getElementById("selEmpreendimento").value;
            const matriz = document.getElementById("matriz");
            const loading = document.getElementById("loading");
            
            if(!idEmpreendimentoAtual) {
                matriz.innerHTML = '<p class="text-slate-500 text-center font-bold mt-10">Selecione um empreendimento.</p>';
                document.getElementById('btnSalvar').classList.remove('pendente');
                return;
            }

            matriz.innerHTML = '';
            loading.classList.remove("hidden");
            rascunhoStatus = {}; 

            const { data, error } = await _supabase
                .from('units')
                .select('id, unit_number, floor, status, typology')
                .eq('development_id', idEmpreendimentoAtual)
                .order('floor', { ascending: false });

            loading.classList.add("hidden");

            if (data && data.length > 0) {
                unidadesGlobal = data;
                data.forEach(u => rascunhoStatus[u.id] = u.status || 'DISPONIVEL');
                renderizarMatriz();
            } else {
                matriz.innerHTML = '<p class="text-slate-500 text-center font-bold mt-10">Nenhuma unidade encontrada.</p>';
            }
        }

        function renderizarMatriz() {
            let andares = {};
            unidadesGlobal.forEach(u => {
                if(!andares[u.floor]) andares[u.floor] = [];
                andares[u.floor].push(u);
            });

            Object.keys(andares).forEach(a => {
                andares[a].sort((a,b) => a.unit_number.localeCompare(b.unit_number, undefined, {numeric: true}));
            });

            const andaresOrdenados = Object.keys(andares).map(Number).sort((a,b) => b - a);
            
            let html = '<table class="w-full border-collapse min-w-max"><tbody>';
            
            andaresOrdenados.forEach(andar => {
                html += `<tr><td class="bg-slate-300 text-slate-800 font-bold p-2 text-xs text-center border-b border-white rounded-l-lg w-16">${andar}º</td>`;
                
                andares[andar].forEach(u => {
                    const status = rascunhoStatus[u.id];
                    let classeCor = 'disp';
                    if (status === 'INDISPONIVEL') classeCor = 'trava';
                    if (status === 'PROMOCIONAL') classeCor = 'promo';

                    html += `<td class="p-1 border-b border-white">
                                <div onclick="clicarUnidade('${u.id}')" class="unit-card ${classeCor} text-center p-1.5 rounded-md min-w-[45px]">
                                    <div class="text-xs font-black">${u.unit_number}</div>
                                </div>
                             </td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';

            document.getElementById("matriz").innerHTML = html;
        }

        function definirModo(modo) {
            modoAtual = modo;
            const btnTrava = document.getElementById("btnModoTrava");
            const btnPromo = document.getElementById("btnModoPromo");

            if (modo === 'TRAVA') {
                btnTrava.className = "flex-1 bg-red-900/50 text-red-400 border border-red-700 rounded-xl text-xs font-bold transition";
                btnPromo.className = "flex-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-xl text-xs font-bold transition";
            } else {
                btnTrava.className = "flex-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-xl text-xs font-bold transition";
                btnPromo.className = "flex-1 bg-blue-900/50 text-blue-400 border border-blue-700 rounded-xl text-xs font-bold transition";
            }
        }

        function clicarUnidade(id) {
            const statusAtual = rascunhoStatus[id];
            
            if (modoAtual === 'TRAVA') {
                rascunhoStatus[id] = (statusAtual === 'INDISPONIVEL') ? 'DISPONIVEL' : 'INDISPONIVEL';
            } else {
                rascunhoStatus[id] = (statusAtual === 'PROMOCIONAL') ? 'DISPONIVEL' : 'PROMOCIONAL';
            }
            
            document.getElementById('btnSalvar').classList.add('pendente');
            renderizarMatriz();
        }

        function abrirModalReset() {
            if(!idEmpreendimentoAtual) return alert("Selecione um empreendimento primeiro.");
            document.getElementById('modalReset').classList.remove('hidden');
        }
        function fecharModal() {
            document.getElementById('modalReset').classList.add('hidden');
        }

        function executarLimpeza(tipo) {
            let contador = 0;
            
            if (tipo === 'TRAVAS' && confirm("Confirma a remoção de TODAS as travas (tornando-as disponíveis)?")) {
                Object.keys(rascunhoStatus).forEach(id => {
                    if(rascunhoStatus[id] === 'INDISPONIVEL') { rascunhoStatus[id] = 'DISPONIVEL'; contador++; }
                });
            } 
            else if (tipo === 'PROMOS' && confirm("Confirma a remoção de TODAS as promoções (retornando ao preço normal)?")) {
                Object.keys(rascunhoStatus).forEach(id => {
                    if(rascunhoStatus[id] === 'PROMOCIONAL') { rascunhoStatus[id] = 'DISPONIVEL'; contador++; }
                });
            }
            else if (tipo === 'TUDO' && confirm("ATENÇÃO: Deseja realmente ZERAR todos os status e deixar todo o prédio disponível?")) {
                Object.keys(rascunhoStatus).forEach(id => {
                    if(rascunhoStatus[id] !== 'DISPONIVEL') { rascunhoStatus[id] = 'DISPONIVEL'; contador++; }
                });
            }

            if(contador > 0) {
                document.getElementById('btnSalvar').classList.add('pendente');
                renderizarMatriz();
            }
            fecharModal();
        }

        async function salvarAlteracoes() {
            if(!idEmpreendimentoAtual) return;
            if(!confirm("Publicar as alterações atuais no banco de dados para todos os corretores?")) return;

            const btn = document.getElementById('btnSalvar');
            btn.innerHTML = '⏳';
            btn.classList.remove('pendente');

            try {
                // Seleciona APENAS as unidades que realmente mudaram no rascunho
                const alteracoes = Object.keys(rascunhoStatus).filter(id => {
                    const original = unidadesGlobal.find(u => u.id === id);
                    return original && original.status !== rascunhoStatus[id];
                });

                if (alteracoes.length === 0) {
                    btn.innerHTML = '💾';
                    return; // Nenhuma unidade foi alterada
                }

                // Dispara os comandos de UPDATE cirúrgicos (Atualiza SÓ a coluna 'status', evitando erros NOT NULL)
                const promessas = alteracoes.map(id => {
                    return _supabase
                        .from('units')
                        .update({ status: rascunhoStatus[id] })
                        .eq('id', id);
                });

                // Aguarda todas as gravações serem concluídas no banco
                const resultados = await Promise.all(promessas);
                
                for (const res of resultados) {
                    if (res.error) throw res.error;
                }

                // Atualiza a memória local para não salvar de novo sem necessidade
                alteracoes.forEach(id => {
                    const original = unidadesGlobal.find(u => u.id === id);
                    if(original) original.status = rascunhoStatus[id];
                });
                
                alert("✅ Estoque publicado com sucesso!");
            } catch (err) {
                alert("❌ Erro ao salvar: " + err.message);
                btn.classList.add('pendente');
            }
            btn.innerHTML = '💾';
        }
    </script>
</body>
</html>
