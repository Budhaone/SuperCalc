<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Central de Estoque - SuperCalc Admin</title>

    <!-- FAVICON SUPERCALC -->
    <link rel="icon" type="image/png" href="favicon supercalc energiaflix.png">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #1a252f;
            --accent: #f1c40f;
            --bg: #f4f6f9;
            --success: #27ae60;
            --danger: #e74c3c;
            --info: #2980b9;
            --border: #cccccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); padding: 8px; font-size: 13px; color: #333; padding-bottom: 75px; }

        .top-bar {
            background: linear-gradient(135deg, #111111 0%, #2c3e50 100%);
            color: var(--accent); padding: 8px 10px; border-radius: 10px; margin-bottom: 6px;
            border: 1.5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;
        }
        .top-bar h1 { font-size: 0.9rem; font-weight: 800; color: #fff; text-transform: uppercase; }

        .selector-card {
            background: #fff; padding: 8px 10px; border-radius: 10px; margin-bottom: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1.5px solid #2980b9;
        }
        .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .selector-grid label { font-size: 0.7rem; font-weight: bold; color: var(--primary); display: block; margin-bottom: 2px; }
        .selector-grid select { width: 100%; padding: 6px 8px; font-size: 0.8rem; border: 1.5px solid var(--border); border-radius: 6px; background: #fff; font-weight: bold; }

        .gavetas-card { background: #fff; padding: 6px 8px; border-radius: 8px; margin-bottom: 6px; border: 1px solid #ddd; }
        .gavetas-bar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
        .btn-gaveta {
            padding: 5px 10px; font-size: 0.7rem; font-weight: bold; border: 1.5px solid var(--border);
            border-radius: 20px; background: #fff; cursor: pointer; white-space: nowrap; color: var(--primary);
        }
        .btn-gaveta.active { background: var(--primary); color: var(--accent); border-color: var(--primary); }

        .stats-bar {
            background: #fff; padding: 6px 10px; border-radius: 8px; margin-bottom: 6px;
            font-size: 0.75rem; font-weight: bold; display: flex; justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #ddd; flex-wrap: wrap; gap: 4px;
        }
        .st-disp { color: #27ae60; }
        .st-promo { color: #2980b9; }
        .st-indisp { color: #e74c3c; }

        .control-card { background: #fff; padding: 8px; border-radius: 10px; margin-bottom: 6px; border: 1px solid #ddd; }
        .mode-toggle-container { display: flex; gap: 4px; background: #eaeded; padding: 3px; border-radius: 8px; margin-bottom: 6px; }
        .mode-btn { flex: 1; padding: 6px 4px; font-size: 0.72rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-align: center; color: #555; }
        .mode-btn.active-lock { background: #e74c3c; color: #fff; }
        .mode-btn.active-promo { background: #2980b9; color: #fff; }

        .filter-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 6px; }
        .filter-grid input, .filter-grid select { width: 100%; padding: 6px 8px; font-size: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; background: #fff; }

        .bulk-actions { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
        .btn-bulk { padding: 6px 4px; font-size: 0.72rem; font-weight: bold; border-radius: 6px; border: none; color: #fff; cursor: pointer; text-align: center; }
        .btn-lock { background: #e74c3c; }
        .btn-free { background: #27ae60; }
        .btn-promo-bulk { background: #2980b9; }
        .btn-reset { background: #7f8c8d; }

        .matrix-wrapper {
            background: #fff; padding: 6px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            overflow-x: auto; max-height: 65vh; border: 1px solid #ddd;
        }
        .matrix-table { width: 100%; border-collapse: separate; border-spacing: 2px; }
        .matrix-table th { background: #2c3e50; color: var(--accent); padding: 5px 2px; font-size: 0.7rem; font-weight: 800; border-radius: 4px; text-align: center; position: sticky; top: 0; z-index: 2; }
        .andar-tag { background: #eaeded; color: #1a252f; font-size: 0.7rem; font-weight: 800; padding: 4px 2px; border-radius: 4px; text-align: center; position: sticky; left: 0; z-index: 1; }

        .unit-card {
            border-radius: 4px; padding: 2px 1px; min-width: 38px; min-height: 30px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; user-select: none; border: 1.5px solid transparent;
        }
        .unit-card .num { font-size: 0.72rem; font-weight: 800; line-height: 1; }
        .unit-card .st { font-size: 0.55rem; font-weight: 700; margin-top: 1px; text-transform: uppercase; }

        .unit-disp { background: #e8f8f5; color: #1e8449; border-color: #27ae60; }
        .unit-promo { background: #ebf5fb; color: #1b4f72; border-color: #2980b9; }
        .unit-indisp { background: #fadbd8; color: #78281f; border-color: #e74c3c; text-decoration: line-through; }

        .btn-fab-save {
            position: fixed; bottom: 16px; right: 16px; width: 54px; height: 54px;
            border-radius: 50%; background: #27ae60; color: #fff; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35); border: 2.5px solid #ffffff; z-index: 9999; cursor: pointer;
        }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a252f; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- BLOQUEIO PIN -->
    <div id="loginOverlay">
        <div style="background: #ffffff; padding: 28px 20px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; border: 2px solid #f1c40f;">
            <h2 style="margin: 0 0 6px 0; color: #1a252f; font-size: 1.3rem;">SUPERCALC - ADMIN</h2>
            <p style="margin: 0 0 16px 0; color: #666; font-size: 0.85rem;">Digite o PIN master de gestão:</p>
            <input type="password" id="inputPinAdmin" placeholder="••••••" style="width: 100%; text-align: center; font-size: 1.8rem; padding: 10px; border: 2px solid #ccc; border-radius: 10px; margin-bottom: 14px;" onkeyup="if(event.key==='Enter') validarPinAdmin()">
            <button onclick="validarPinAdmin()" style="width: 100%; background: #27ae60; color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;">Acessar Gestor Central</button>
            <p id="msgErroAdmin" style="color: #e74c3c; font-size: 0.85rem; margin-top: 10px; display: none; font-weight: bold;">PIN incorreto ou não autorizado!</p>
        </div>
    </div>

    <!-- CABEÇALHO -->
    <div class="top-bar">
        <h1>GESTOR CENTRAL DE ESTOQUE SUPERCALC</h1>
        <button onclick="window.print()" style="background:#2980b9; color:#fff; border:none; padding:4px 8px; border-radius:6px; font-weight:bold; cursor:pointer;">PDF Espelho</button>
    </div>

    <!-- SELETOR MULTI-EMPREENDIMENTO -->
    <div class="selector-card">
        <div class="selector-grid">
            <div>
                <label>1. INCORPORADORA:</label>
                <select id="selIncorporadora" onchange="carregarEmpreendimentos()">
                    <option value="">Todas</option>
                    <option value="AAM Incorporadora">AAM Incorporadora</option>
                    <option value="Marquês Construtora">Marquês Construtora</option>
                    <option value="Imóveis de Terceiros">Imóveis de Terceiros</option>
                </select>
            </div>
            <div>
                <label>2. EMPREENDIMENTO:</label>
                <select id="selEmpreendimento" onchange="carregarMapeamentoEmpreendimento()">
                    <option value="">Selecione...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- BARRA DE GAVETAS (MODALIDADES) -->
    <div class="gavetas-card">
        <label style="font-size: 0.68rem; font-weight: bold; color: var(--primary); margin-bottom: 3px; display: block;">FILTRAR GAVETA / MODALIDADE:</label>
        <div class="gavetas-bar">
            <button class="btn-gaveta active" onclick="filtrarGaveta('TODOS', this)">Todas as Unidades</button>
            <button class="btn-gaveta" onclick="filtrarGaveta('HIS', this)">Gaveta 1: HIS</button>
            <button class="btn-gaveta" onclick="filtrarGaveta('HMP', this)">Gaveta 2: HMP</button>
            <button class="btn-gaveta" onclick="filtrarGaveta('NR', this)">Gaveta 3: NR / Short Stay</button>
            <button class="btn-gaveta" onclick="filtrarGaveta('R2V', this)">Gaveta 4: R2V (Com Vaga)</button>
            <button class="btn-gaveta" onclick="filtrarGaveta('TERCEIROS', this)">Gaveta 5: Avulsos</button>
        </div>
    </div>

    <!-- RESUMO DE ESTOQUE -->
    <div class="stats-bar">
        <span>Matriz: <strong id="lblTotalMatriz">0</strong></span>
        <span class="st-disp">🟢 Disp: <strong id="lblTotalDisp">0</strong></span>
        <span class="st-promo">🔵 Promo: <strong id="lblTotalPromo">0</strong></span>
        <span class="st-indisp">🔴 Indisp: <strong id="lblTotalIndisp">0</strong></span>
    </div>

    <!-- CONTROLES E FILTROS -->
    <div class="control-card">
        <div class="mode-toggle-container">
            <button id="btnModoTrava" class="mode-btn active-lock" onclick="setModo('TRAVA')">🔴 Clique: Disp ⇄ Trava</button>
            <button id="btnModoPromo" class="mode-btn" onclick="setModo('PROMO')">🔵 Clique: Disp ⇄ Promo</button>
        </div>

        <div class="filter-grid">
            <div>
                <select id="filtroFaixaAndar" onchange="aplicarFiltros()">
                    <option value="TODOS">Todos os Pavimentos</option>
                    <option value="BAIXO">Andares Baixos (1º ao 10º)</option>
                    <option value="MEDIO">Andares Médios (11º ao 25º)</option>
                    <option value="ALTO">Andares Altos (26º ao 37º)</option>
                </select>
            </div>
            <div>
                <select id="filterPrumada" onchange="aplicarFiltros()">
                    <option value="">Todas as Prumadas</option>
                </select>
            </div>
            <div>
                <input type="text" id="filterText" placeholder="Ex: 2217" onkeyup="aplicarFiltros()">
            </div>
        </div>

        <div class="bulk-actions">
            <button class="btn-bulk btn-lock" onclick="confirmarStatusEmLote('INDISPONIVEL')">🔒 Travar</button>
            <button class="btn-bulk btn-free" onclick="confirmarStatusEmLote('DISPONIVEL')">🔓 Liberar</button>
            <button class="btn-bulk btn-promo-bulk" onclick="confirmarStatusEmLote('PROMOCIONAL')">🏷️ Promo</button>
            <button class="btn-bulk btn-reset" onclick="resetarFiltros()">🔄 Reset</button>
        </div>
    </div>

    <!-- GRID DINÂMICO -->
    <div class="matrix-wrapper">
        <table class="matrix-table">
            <thead><tr id="matrixHeader"><th>Andar</th></tr></thead>
            <tbody id="matrixBody"></tbody>
        </table>
    </div>

    <button class="btn-fab-save" onclick="salvarEstoque()" title="Salvar Alterações">💾</button>

    <script>
        const SUPABASE_URL = 'https://SEU_PROJETO.supabase.co';
        const SUPABASE_KEY = 'SUA_CHAVE_ANON_PUBLIC_AQUI';
        let supabaseClient = null;

        if (typeof supabase !== 'undefined' && SUPABASE_URL.indexOf('SEU_PROJETO') === -1) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        const MOCK_EMPREENDIMENTOS = [
            { id: 'a2222222-2222-2222-2222-222222222222', title: 'Poema Liberdade', developer_name: 'AAM Incorporadora', is_ready: false, is_third_party: false },
            { id: 'a1111111-1111-1111-1111-111111111111', title: 'Sky Pinheiros', developer_name: 'AAM Incorporadora', is_ready: true, is_third_party: false },
            { id: 'a3333333-3333-3333-3333-333333333333', title: 'NOW Butantã', developer_name: 'AAM Incorporadora', is_ready: true, is_third_party: false }
        ];

        let empreendimentoAtual = null;
        let unidadesGlobais = [];
        let prumadasUnicas = [];
        let modoAtivo = 'TRAVA';
        let gavetaAtiva = 'TODOS';

        window.onload = function() {
            if (sessionStorage.getItem("auth_admin_ok") === "true") {
                document.getElementById("loginOverlay").style.display = "none";
                carregarEmpreendimentos();
            }
        };

        function validarPinAdmin() {
            const digitado = document.getElementById("inputPinAdmin").value.trim();
            if (digitado === "123456" || digitado === "120873") {
                sessionStorage.setItem("auth_admin_ok", "true");
                document.getElementById("loginOverlay").style.display = "none";
                carregarEmpreendimentos();
            } else {
                document.getElementById("msgErroAdmin").style.display = "block";
            }
        }

        async function carregarEmpreendimentos() {
            const incSel = document.getElementById("selIncorporadora").value;
            const selEmp = document.getElementById("selEmpreendimento");
            selEmp.innerHTML = '<option value="">Carregando...</option>';

            let list = MOCK_EMPREENDIMENTOS;
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('developments').select('*').order('title');
                    if (data && data.length > 0) list = data;
                } catch(e) {}
            }

            selEmp.innerHTML = '<option value="">Selecione...</option>';
            list.forEach(emp => {
                if (!incSel || emp.developer_name === incSel) {
                    const opt = document.createElement("option");
                    opt.value = emp.id;
                    opt.innerText = `${emp.title} (${emp.developer_name})`;
                    selEmp.appendChild(opt);
                }
            });

            if (selEmp.options.length > 1) {
                selEmp.selectedIndex = 1;
                carregarMapeamentoEmpreendimento();
            }
        }

        async function carregarMapeamentoEmpreendimento() {
            const empId = document.getElementById("selEmpreendimento").value;
            if (!empId) return;

            empreendimentoAtual = empId;
            unidadesGlobais = [];

            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('units').select('*').eq('development_id', empId).order('unit_number');
                    if (data) unidadesGlobais = data;
                } catch(e) {}
            }

            // Fallback de simulação local caso o banco não tenha retornado dados
            if (unidadesGlobais.length === 0) {
                const andares = empId.includes('2222') ? 37 : 20;
                const prumadas = empId.includes('2222') ? 18 : 8;
                for (let a = 1; a <= andares; a++) {
                    for (let p = 1; p <= prumadas; p++) {
                        const pStr = p < 10 ? `0${p}` : `${p}`;
                        unidadesGlobais.push({
                            id: `u_${a}_${pStr}`,
                            unit_number: `${a}${pStr}`,
                            floor: a,
                            typology: p <= 4 ? 'HIS' : (p <= 8 ? 'HMP' : 'R2V'),
                            status: 'DISPONIVEL',
                            list_price: 350000 + (a * 4000),
                            private_area_m2: 38.0
                        });
                    }
                }
            }

            // Mapeamento dinâmico de prumadas
            const pSet = new Set();
            unidadesGlobais.forEach(u => {
                const num = String(u.unit_number);
                const final = num.length >= 3 ? num.slice(-2) : num;
                pSet.add(final);
            });
            prumadasUnicas = Array.from(pSet).sort((a,b) => parseInt(a) - parseInt(b));

            const selP = document.getElementById("filterPrumada");
            selP.innerHTML = '<option value="">Todas as Prumadas</option>';
            prumadasUnicas.forEach(p => selP.innerHTML += `<option value="${p}">Prumada ${p}</option>`);

            renderizarGrid();
        }

        function renderizarGrid() {
            const thead = document.getElementById("matrixHeader");
            const tbody = document.getElementById("matrixBody");
            
            thead.innerHTML = '<th>Andar</th>';
            prumadasUnicas.forEach(p => thead.innerHTML += `<th class="col-prumada-${p}">P.${p}</th>`);

            tbody.innerHTML = '';

            const andaresMap = new Map();
            let cntDisp = 0, cntPromo = 0, cntIndisp = 0;

            unidadesGlobais.forEach(u => {
                const num = String(u.unit_number);
                const final = num.length >= 3 ? num.slice(-2) : num;
                
                if (gavetaAtiva !== 'TODOS' && !u.typology.toUpperCase().includes(gavetaAtiva)) return;

                if (!andaresMap.has(u.floor)) andaresMap.set(u.floor, new Map());
                andaresMap.get(u.floor).set(final, u);
            });

            const andaresOrdenados = Array.from(andaresMap.keys()).sort((a,b) => b - a);

            andaresOrdenados.forEach(andar => {
                const tr = document.createElement("tr");
                tr.setAttribute("data-andar", andar);
                let rowHtml = `<td class="andar-tag">${andar}º</td>`;

                prumadasUnicas.forEach(p => {
                    const u = andaresMap.get(andar)?.get(p);
                    if (u) {
                        let stClass = 'unit-disp';
                        let stTxt = 'DISP';
                        if (u.status === 'INDISPONIVEL') { stClass = 'unit-indisp'; stTxt = 'TRAV'; cntIndisp++; }
                        else if (u.status === 'PROMOCIONAL') { stClass = 'unit-promo'; stTxt = 'PROMO'; cntPromo++; }
                        else { cntDisp++; }

                        rowHtml += `
                            <td class="col-prumada-${p}">
                                <div class="unit-card ${stClass}" data-num="${u.unit_number}" onclick="alternarStatus('${u.id}')" ondblclick="dispararParaSuperCalc('${u.id}')">
                                    <span class="num">${u.unit_number}</span>
                                    <span class="st">${stTxt}</span>
                                </div>
                            </td>`;
                    } else {
                        rowHtml += `<td class="col-prumada-${p}"></td>`;
                    }
                });

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });

            document.getElementById("lblTotalMatriz").innerText = unidadesGlobais.length;
            document.getElementById("lblTotalDisp").innerText = cntDisp;
            document.getElementById("lblTotalPromo").innerText = cntPromo;
            document.getElementById("lblTotalIndisp").innerText = cntIndisp;

            aplicarFiltros();
        }

        async function alternarStatus(unitId) {
            const u = unidadesGlobais.find(x => x.id === unitId);
            if (!u) return;

            let novoStatus = 'DISPONIVEL';
            if (modoAtivo === 'TRAVA') {
                novoStatus = (u.status === 'INDISPONIVEL') ? 'DISPONIVEL' : 'INDISPONIVEL';
            } else {
                novoStatus = (u.status === 'PROMOCIONAL') ? 'DISPONIVEL' : 'PROMOCIONAL';
            }

            u.status = novoStatus;
            renderizarGrid();

            if (supabaseClient) {
                try { await supabaseClient.from('units').update({ status: novoStatus }).eq('id', unitId); } catch(e) {}
            }
        }

        function aplicarFiltros() {
            const faixa = document.getElementById("filtroFaixaAndar").value;
            const prumadaSel = document.getElementById("filterPrumada").value;
            const query = document.getElementById("filterText").value.trim().toLowerCase();

            prumadasUnicas.forEach(p => {
                const cols = document.querySelectorAll(`.col-prumada-${p}`);
                cols.forEach(c => c.style.display = (!prumadaSel || prumadaSel === p) ? '' : 'none');
            });

            const trs = document.querySelectorAll("#matrixBody tr");
            trs.forEach(tr => {
                const andar = parseInt(tr.getAttribute("data-andar"));
                let matchFaixa = true;

                if (faixa === "BAIXO") matchFaixa = (andar >= 1 && andar <= 10);
                else if (faixa === "MEDIO") matchFaixa = (andar >= 11 && andar <= 25);
                else if (faixa === "ALTO") matchFaixa = (andar >= 26);

                const cards = tr.querySelectorAll(".unit-card");
                let matchText = false;
                cards.forEach(card => {
                    const num = card.getAttribute("data-num");
                    if (!query || num.includes(query) || String(andar) === query) matchText = true;
                });

                tr.style.display = (matchFaixa && (!query || matchText)) ? '' : 'none';
            });
        }

        function confirmarStatusEmLote(novoStatus) {
            const confirmou = confirm(`⚠️ Trava de Segurança: Deseja alterar todas as unidades visíveis para "${novoStatus}"?`);
            if (!confirmou) return;

            const trsVisiveis = document.querySelectorAll("#matrixBody tr:not([style*='display: none'])");
            trsVisiveis.forEach(tr => {
                const cards = tr.querySelectorAll(".unit-card");
                cards.forEach(card => {
                    const parentTd = card.closest('td');
                    if (parentTd && parentTd.style.display !== 'none') {
                        const num = card.getAttribute("data-num");
                        const u = unidadesGlobais.find(x => String(x.unit_number) === String(num));
                        if (u) u.status = novoStatus;
                    }
                });
            });
            renderizarGrid();
        }

        function resetarFiltros() {
            document.getElementById("filtroFaixaAndar").value = 'TODOS';
            document.getElementById("filterPrumada").value = '';
            document.getElementById("filterText").value = '';
            aplicarFiltros();
        }

        function filtrarGaveta(gaveta, btn) {
            gavetaAtiva = gaveta;
            document.querySelectorAll('.btn-gaveta').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderizarGrid();
        }

        function setModo(m) {
            modoAtivo = m;
            document.getElementById("btnModoTrava").className = m === 'TRAVA' ? 'mode-btn active-lock' : 'mode-btn';
            document.getElementById("btnModoPromo").className = m === 'PROMO' ? 'mode-btn active-promo' : 'mode-btn';
        }

        function salvarEstoque() {
            alert("✅ Estoque e disponibilidades sincronizados!");
        }

        function dispararParaSuperCalc(unitId) {
            const u = unidadesGlobais.find(x => x.id === unitId);
            if (!u || u.status === 'INDISPONIVEL') {
                alert("⚠️ Unidades indisponíveis ou travadas não podem ser simuladas.");
                return;
            }

            const payload = {
                empreendimento: 'Poema Liberdade',
                unidade: u.unit_number,
                precoTabela: u.list_price,
                m2: u.private_area_m2,
                dorms: u.typology,
                is_ready: false,
                origem: 'GLOBAL'
            };

            localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(payload));
            window.location.href = "supercalc.html";
        }
    </script>
</body>
</html>
