<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Estoque | SuperCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* Animações e Estilos dos Cartões da Matriz */
        .unit-card { transition: all 0.15s ease; cursor: pointer; user-select: none; }
        .unit-card:active { transform: scale(0.92); }
        .disp { background-color: #dcfce7; color: #166534; border: 1px solid #22c55e; }
        .promo { background-color: #dbeafe; color: #1e3a8a; border: 1px solid #3b82f6; }
        .trava { background-color: #fee2e2; color: #991b1b; border: 1px solid #ef4444; text-decoration: line-through; opacity: 0.8; }
        
        /* Botão Flutuante (Disquete) */
        .btn-fab-save {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            border-radius: 50%; background: #10b981; color: white; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 2px solid white; z-index: 50;
            cursor: pointer; transition: transform 0.2s ease, background 0.2s ease;
        }
        .btn-fab-save:active { transform: scale(0.9); }
        .btn-fab-save.pendente { background: #f59e0b; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* Scrollbar customizada para tema escuro */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen pb-24 selection:bg-amber-400 selection:text-slate-900">

    <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-40 shadow-lg border-t-4 border-t-amber-400">
        <div class="max-w-6xl mx-auto space-y-4">
            <div>
                <h1 class="text-xl font-black text-amber-400 tracking-tight uppercase">⚙️ Gestor Central de Estoque</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-1">Alterações e Travas em Tempo Real</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <select id="selEmpreendimento" onchange="carregarEmpreendimento()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 rounded-xl p-2.5 text-sm font-bold outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition">
                    <option value="">Carregando Empreendimentos...</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="definirModo('TRAVA')" id="btnModoTrava" class="flex-1 bg-red-900/60 text-red-300 border border-red-700 rounded-xl text-xs font-bold transition shadow-inner">🔴 Alternar Trava</button>
                    <button onclick="definirModo('PROMO')" id="btnModoPromo" class="flex-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-xl text-xs font-bold transition">🔵 Alternar Promo</button>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 pt-1">
                <button onclick="abrirModalReset()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-lg text-xs font-bold text-slate-300 transition shadow">🔄 Ferramentas de Limpeza...</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-4">
        
        <!-- BARRA DE CONTADORES -->
        <div id="barraContadores" class="hidden flex flex-wrap gap-2 md:gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800 shadow-md">
            <div class="flex-1 min-w-[100px] text-center bg-slate-900 py-2 rounded-lg border border-slate-700">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Total Matriz</p>
                <p id="countTotal" class="text-lg font-black text-amber-400">0</p>
            </div>
            <div class="flex-1 min-w-[100px] text-center bg-emerald-900/20 py-2 rounded-lg border border-emerald-800/40">
                <p class="text-[10px] text-emerald-600/70 font-bold uppercase tracking-wider">Disponíveis</p>
                <p id="countDisp" class="text-lg font-black text-emerald-400">0</p>
            </div>
            <div class="flex-1 min-w-[100px] text-center bg-red-900/20 py-2 rounded-lg border border-red-800/40">
                <p class="text-[10px] text-red-600/70 font-bold uppercase tracking-wider">Travadas</p>
                <p id="countTrava" class="text-lg font-black text-red-400">0</p>
            </div>
            <div class="flex-1 min-w-[100px] text-center bg-blue-900/20 py-2 rounded-lg border border-blue-800/40">
                <p class="text-[10px] text-blue-600/70 font-bold uppercase tracking-wider">Promocional</p>
                <p id="countPromo" class="text-lg font-black text-blue-400">0</p>
            </div>
        </div>

        <div id="loading" class="py-16 text-center hidden">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber-400 mx-auto mb-3"></div>
            <p class="text-slate-400 font-bold text-sm">Carregando matriz do banco de dados...</p>
        </div>
        
        <!-- MATRIZ DE APARTAMENTOS -->
        <div id="matriz" class="bg-slate-100 p-4 rounded-xl overflow-x-auto shadow-inner min-h-[300px]">
            <p class="text-slate-500 text-center font-bold mt-10">Selecione um empreendimento acima para visualizar a matriz.</p>
        </div>
    </main>

    <!-- BOTÃO FLUTUANTE DO DISQUETE -->
    <button id="btnSalvar" class="btn-fab-save" onclick="salvarAlteracoes()" title="Salvar e Publicar">💾</button>

    <!-- MODAL DE RESETS -->
    <div id="modalReset" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full space-y-3 shadow-2xl text-center">
            <h3 class="text-lg font-black text-amber-400 mb-2 uppercase tracking-tight">Opções de Limpeza</h3>
            <button onclick="executarLimpeza('TRAVAS')" class="w-full bg-slate-800 hover:bg-slate-700 border border-red-900 text-red-400 font-bold py-2.5 rounded-xl transition text-sm">Remover TODAS as Travas</button>
            <button onclick="executarLimpeza('PROMOS')" class="w-full bg-slate-800 hover:bg-slate-700 border border-blue-900 text-blue-400 font-bold py-2.5 rounded-xl transition text-sm">Remover TODAS as Promoções</button>
            <hr class="border-slate-800 my-2">
            <button onclick="executarLimpeza('TUDO')" class="w-full bg-red-900/80 hover:bg-red-800 border border-red-700 text-white font-bold py-2.5 rounded-xl transition text-sm shadow">⚠ ZERAR (Tudo Disponível)</button>
            <button onclick="fecharModal()" class="w-full bg-slate-700 text-slate-300 hover:text-white font-bold py-2.5 rounded-xl mt-3 text-sm transition">Cancelar</button>
        </div>
    </div>

    <script>
        let unidadesGlobal = [];
        let rascunhoStatus = {}; 
        let modoAtual = 'TRAVA';
        let idEmpreendimentoAtual = null;

        // FUNÇÃO ROBUSTA DE CAPTURA DO SUPABASE (A mesma do index.html)
        function obterClienteSupabase() {
            if (typeof _supabase !== 'undefined' && _supabase) return _supabase;
            if (typeof window._supabase !== 'undefined' && window._supabase) return window._supabase;
            if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) return window.supabaseClient;
            if (typeof supabaseClient !== 'undefined' && supabaseClient) return supabaseClient;
            if (typeof window.supabase !== 'undefined' && window.supabase && typeof window.supabase.from === 'function') return window.supabase;
            if (typeof supabase !== 'undefined' && supabase && typeof supabase.from === 'function') return supabase;
            return null;
        }

        window.onload = async () => { await listarEmpreendimentos(); };

        // 1. Carrega os empreendimentos do Supabase
        async function listarEmpreendimentos() {
            try {
                const sb = obterClienteSupabase();
                if (!sb) {
                    document.getElementById("selEmpreendimento").innerHTML = '<option value="">Erro: Cliente Supabase não encontrado.</option>';
                    return;
                }

                const { data, error } = await sb.from('developments').select('id, title').order('title');
                
                if (error) throw error;

                if (data) {
                    const sel = document.getElementById("selEmpreendimento");
                    sel.innerHTML = '<option value="">Selecione um Empreendimento...</option>' + 
                        data.map(d => `<option value="${d.id}">${d.title}</option>`).join('');
                }
            } catch (err) {
                console.error("Erro ao listar empreendimentos:", err);
                document.getElementById("selEmpreendimento").innerHTML = '<option value="">Falha de conexão com a nuvem.</option>';
            }
        }

        // 2. Busca unidades do prédio e constrói o Rascunho de Status
        async function carregarEmpreendimento() {
            idEmpreendimentoAtual = document.getElementById("selEmpreendimento").value;
            const matriz = document.getElementById("matriz");
            const loading = document.getElementById("loading");
            const barraContadores = document.getElementById("barraContadores");
            
            if(!idEmpreendimentoAtual) {
                matriz.innerHTML = '<p class="text-slate-500 text-center font-bold mt-10">Selecione um empreendimento.</p>';
                document.getElementById('btnSalvar').classList.remove('pendente');
                barraContadores.classList.add("hidden");
                return;
            }

            matriz.innerHTML = '';
            loading.classList.remove("hidden");
            barraContadores.classList.add("hidden");
            rascunhoStatus = {}; 

            try {
                const sb = obterClienteSupabase();
                const { data, error } = await sb
                    .from('units')
                    .select('*')
                    .eq('development_id', idEmpreendimentoAtual)
                    .order('floor', { ascending: false });

                loading.classList.add("hidden");

                if (error) throw error;

                if (data && data.length > 0) {
                    unidadesGlobal = data;
                    data.forEach(u => rascunhoStatus[u.id] = u.status || 'DISPONIVEL');
                    barraContadores.classList.remove("hidden"); 
                    
                    atualizarContadores();
                    renderizarMatriz();
                } else {
                    matriz.innerHTML = '<p class="text-slate-500 text-center font-bold mt-10">Nenhuma unidade encontrada.</p>';
                }
            } catch (err) {
                loading.classList.add("hidden");
                matriz.innerHTML = '<p class="text-red-500 text-center font-bold mt-10">Erro ao consultar o banco de dados.</p>';
                console.error("Erro ao carregar matriz:", err);
            }
        }

        // 3. Atualiza os números da barra de contadores dinamicamente
        function atualizarContadores() {
            if (!unidadesGlobal || unidadesGlobal.length === 0) return;

            let qtdDisp = 0, qtdTrava = 0, qtdPromo = 0;

            Object.values(rascunhoStatus).forEach(status => {
                if (status === 'INDISPONIVEL') qtdTrava++;
                else if (status === 'PROMOCIONAL') qtdPromo++;
                else qtdDisp++;
            });

            document.getElementById('countTotal').innerText = unidadesGlobal.length;
            document.getElementById('countDisp').innerText = qtdDisp;
            document.getElementById('countTrava').innerText = qtdTrava;
            document.getElementById('countPromo').innerText = qtdPromo;
        }

        // 4. Desenha a matriz separando por andar
        function renderizarMatriz() {
            let andares = {};
            unidadesGlobal.forEach(u => {
                if(!andares[u.floor]) andares[u.floor] = [];
                andares[u.floor].push(u);
            });

            Object.keys(andares).forEach(a => {
                andares[a].sort((a,b) => a.unit_number.localeCompare(b.unit_number, undefined, {numeric: true}));
            });

            const andaresOrdenados = Object.keys(andares).map(Number).sort((a,b) => b - a);
            
            let html = '<table class="w-full border-collapse min-w-max"><tbody>';
            
            andaresOrdenados.forEach(andar => {
                html += `<tr><td class="bg-slate-300 text-slate-800 font-black p-2 text-xs text-center border-b border-white rounded-l-lg w-16">${andar}º</td>`;
                
                andares[andar].forEach(u => {
                    const status = rascunhoStatus[u.id];
                    let classeCor = 'disp';
                    if (status === 'INDISPONIVEL') classeCor = 'trava';
                    if (status === 'PROMOCIONAL') classeCor = 'promo';

                    html += `<td class="p-1 border-b border-white">
                                <div onclick="clicarUnidade('${u.id}')" class="unit-card ${classeCor} text-center p-1.5 rounded-md min-w-[45px] shadow-sm">
                                    <div class="text-xs font-black">${u.unit_number}</div>
                                </div>
                             </td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';

            document.getElementById("matriz").innerHTML = html;
        }

        // 5. Define a ação do clique (Travar vs Destacar Promoção)
        function definirModo(modo) {
            modoAtual = modo;
            const btnTrava = document.getElementById("btnModoTrava");
            const btnPromo = document.getElementById("btnModoPromo");

            if (modo === 'TRAVA') {
                btnTrava.className = "flex-1 bg-red-900/60 text-red-300 border border-red-700 rounded-xl text-xs font-bold transition shadow-inner";
                btnPromo.className = "flex-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-xl text-xs font-bold transition";
            } else {
                btnTrava.className = "flex-1 bg-slate-800 text-slate-400 border border-slate-700 rounded-xl text-xs font-bold transition";
                btnPromo.className = "flex-1 bg-blue-900/60 text-blue-300 border border-blue-700 rounded-xl text-xs font-bold transition shadow-inner";
            }
        }

        // 6. Ao clicar no apartamento, muda o rascunho, ativa o disquete e atualiza a barra
        function clicarUnidade(id) {
            const statusAtual = rascunhoStatus[id];
            
            if (modoAtual === 'TRAVA') {
                rascunhoStatus[id] = (statusAtual === 'INDISPONIVEL') ? 'DISPONIVEL' : 'INDISPONIVEL';
            } else {
                rascunhoStatus[id] = (statusAtual === 'PROMOCIONAL') ? 'DISPONIVEL' : 'PROMOCIONAL';
            }
            
            document.getElementById('btnSalvar').classList.add('pendente');
            atualizarContadores();
            renderizarMatriz();
        }

        function abrirModalReset() {
            if(!idEmpreendimentoAtual) return alert("Selecione um empreendimento primeiro.");
            document.getElementById('modalReset').classList.remove('hidden');
        }
        function fecharModal() { document.getElementById('modalReset').classList.add('hidden'); }

        // 7. Opções de Limpeza em Massa
        function executarLimpeza(tipo) {
            let contador = 0;
            if (tipo === 'TRAVAS' && confirm("Confirma a remoção de TODAS as travas (tornando-as disponíveis)?")) {
                Object.keys(rascunhoStatus).forEach(id => {
                    if(rascunhoStatus[id] === 'INDISPONIVEL') { rascunhoStatus[id] = 'DISPONIVEL'; contador++; }
                });
            } else if (tipo === 'PROMOS' && confirm("Confirma a remoção de TODAS as promoções (retornando ao preço normal)?")) {
                Object.keys(rascunhoStatus).forEach(id => {
                    if(rascunhoStatus[id] === 'PROMOCIONAL') { rascunhoStatus[id] = 'DISPONIVEL'; contador++; }
                });
            } else if (tipo === 'TUDO' && confirm("ATENÇÃO: Deseja realmente ZERAR todos os status e deixar todo o prédio disponível?")) {
                Object.keys(rascunhoStatus).forEach(id => {
                    if(rascunhoStatus[id] !== 'DISPONIVEL') { rascunhoStatus[id] = 'DISPONIVEL'; contador++; }
                });
            }

            if(contador > 0) {
                document.getElementById('btnSalvar').classList.add('pendente');
                atualizarContadores();
                renderizarMatriz();
            }
            fecharModal();
        }

        // 8. Rotina de Salvamento Blindada (Evita o erro de Metragem Nula no Banco)
        async function salvarAlteracoes() {
            if(!idEmpreendimentoAtual) return;
            if(!confirm("Salvar as alterações e publicá-las na Prateleira de Imóveis?")) return;

            const btn = document.getElementById('btnSalvar');
            btn.innerHTML = '⏳';
            btn.classList.remove('pendente');

            try {
                const sb = obterClienteSupabase();
                if (!sb) throw new Error("Cliente Supabase inativo.");

                // Recupera as colunas originais junto com o novo status
                const updates = Object.keys(rascunhoStatus).map(id => {
                    const orig = unidadesGlobal.find(u => u.id === id);
                    return {
                        id: id,
                        development_id: idEmpreendimentoAtual,
                        unit_number: orig.unit_number,
                        floor: orig.floor,
                        typology: orig.typology,
                        private_area_m2: orig.private_area_m2, 
                        list_price: orig.list_price,           
                        status: rascunhoStatus[id]
                    };
                });

                const { error } = await sb.from('units').upsert(updates);
                if(error) throw error;
                
                alert("✅ Estoque atualizado com sucesso!");
            } catch (err) {
                alert("❌ Erro ao salvar: " + err.message);
                btn.classList.add('pendente');
            }
            btn.innerHTML = '💾';
        }
    </script>
</body>
</html>
