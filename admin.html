<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Central de Estoque | SuperCalc Admin</title>
    <link rel="icon" type="image/png" href="favicon supercalc energiaflix.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        .unit-btn {
            user-select: none;
            transition: all 0.15s ease-in-out;
        }
        .unit-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- CABEÇALHO DO PAINEL GESTOR -->
    <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-xl font-black text-amber-400 tracking-tight flex items-center gap-2">
                    🛡️ GESTOR CENTRAL DE ESTOQUE SUPERCALC
                </h1>
                <p class="text-xs text-slate-400 font-medium">Controle de Espelho de Vendas e Status em Tempo Real</p>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition shadow">
                    ← Voltar à Prateleira
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-3 md:p-6 space-y-4 flex-1 w-full">

        <!-- PAINEL DE CONTROLE E SELEÇÃO DE EMPREENDIMENTO -->
        <section class="bg-slate-800 p-4 md:p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 1. Incorporadora -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">1. Incorporadora / Origem:</label>
                    <select id="selIncorporadora" onchange="filtrarEmpreendimentosPorIncorporadora()" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-xs font-bold text-slate-100 outline-none focus:border-amber-400">
                        <option value="TODAS">Todas as Incorporadoras</option>
                    </select>
                </div>

                <!-- 2. Empreendimento -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">2. Empreendimento:</label>
                    <select id="selEmpreendimento" onchange="carregarEstoqueEmpreendimento()" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-xs font-bold text-amber-400 outline-none focus:border-amber-400">
                        <option value="">Carregando Empreendimentos...</option>
                    </select>
                </div>
            </div>

            <!-- FILTRO DA 4ª GAVETA (ENQUADRAMENTO / INCOME_TYPE) -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filtrar Enquadramento (4ª Gaveta / Modalidade):</label>
                <div class="flex flex-wrap gap-2" id="containerBotoesGaveta">
                    <button onclick="setFiltroGaveta('TODAS', this)" class="btn-gaveta px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-400 text-slate-950 shadow">Todas as Unidades</button>
                    <button onclick="setFiltroGaveta('HIS', this)" class="btn-gaveta px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-purple-300 border border-slate-700 hover:bg-slate-700">HIS</button>
                    <button onclick="setFiltroGaveta('HMP', this)" class="btn-gaveta px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-orange-300 border border-slate-700 hover:bg-slate-700">HMP</button>
                    <button onclick="setFiltroGaveta('NR', this)" class="btn-gaveta px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-pink-300 border border-slate-700 hover:bg-slate-700">NR / Short Stay</button>
                    <button onclick="setFiltroGaveta('R2V', this)" class="btn-gaveta px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-blue-300 border border-slate-700 hover:bg-slate-700">R2V (Livre)</button>
                    <button onclick="setFiltroGaveta('LOJA', this)" class="btn-gaveta px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-yellow-300 border border-slate-700 hover:bg-slate-700">LOJA</button>
                    <button onclick="setFiltroGaveta('LIVRE', this)" class="btn-gaveta px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-emerald-300 border border-slate-700 hover:bg-slate-700">Terceiros / Avulsos</button>
                </div>
            </div>

            <!-- CONTADORES RESUMIDOS -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800 text-center text-xs font-bold">
                <div class="text-slate-300">Total: <span id="lblTotalMatriz" class="text-amber-400 text-sm">0</span></div>
                <div class="text-emerald-400">🟢 Disponíveis: <span id="lblDispMatriz" class="text-sm">0</span></div>
                <div class="text-blue-400">🔵 Promo: <span id="lblPromoMatriz" class="text-sm">0</span></div>
                <div class="text-red-400">🔴 Trava / Indisp: <span id="lblIndispMatriz" class="text-sm">0</span></div>
            </div>

            <!-- ALTERNADOR DE MODO DE CLIQUE E BUSCA -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-700">
                <button id="btnModoTrava" onclick="setModoClique('TRAVA')" class="w-full py-2 px-3 rounded-xl text-xs font-bold bg-red-600 hover:bg-red-500 text-white transition shadow flex items-center justify-center gap-1">
                    🔴 Clique Alterna: Disp ⇄ Trava
                </button>
                <button id="btnModoPromo" onclick="setModoClique('PROMO')" class="w-full py-2 px-3 rounded-xl text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 transition flex items-center justify-center gap-1">
                    🔵 Clique Alterna: Disp ⇄ Promo
                </button>
                <input type="text" id="txtBuscaUnidade" onkeyup="aplicarFiltrosMatriz()" placeholder="Buscar por número (Ex: 1714, 501)..." class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2 text-xs font-medium text-slate-100 outline-none focus:border-amber-400">
            </div>

            <!-- AÇÕES EM LOTE -->
            <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-700/50">
                <button onclick="alterarStatusVisiveis('INDISPONIVEL')" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-800 px-3 py-1.5 rounded-lg text-xs font-bold transition">🔒 Travar Visíveis</button>
                <button onclick="alterarStatusVisiveis('DISPONIVEL')" class="bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 border border-emerald-800 px-3 py-1.5 rounded-lg text-xs font-bold transition">🔓 Liberar Visíveis</button>
                <button onclick="alterarStatusVisiveis('PROMOCIONAL')" class="bg-blue-950/80 hover:bg-blue-900 text-blue-300 border border-blue-800 px-3 py-1.5 rounded-lg text-xs font-bold transition">🏷️ Promo Visíveis</button>
            </div>
        </section>

        <!-- ESPELHO DE VENDAS / MATRIZ DE UNIDADES -->
        <section class="bg-slate-800 p-4 md:p-6 rounded-2xl border border-slate-700 shadow-xl min-h-[300px]">
            <div id="loadingMatriz" class="py-12 text-center text-slate-400 font-bold text-xs space-y-2">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-amber-400"></div>
                <p>Carregando empreendimentos do banco de dados...</p>
            </div>

            <div id="containerMatriz" class="hidden overflow-x-auto space-y-2">
                <!-- Linhas dos andares geradas via JS -->
            </div>
        </section>
    </main>

    <!-- SCRIPT DE INTEGRAÇÃO COM O SUPABASE -->
    <script>
        let empreendimentosDB = [];
        let unidadesDB = [];
        let modoClique = 'TRAVA'; // 'TRAVA' ou 'PROMO'
        let filtroGavetaAtual = 'TODAS';

        window.onload = async () => {
            await carregarEmpreendimentos();
        };

        async function carregarEmpreendimentos() {
            try {
                if (typeof _supabase === 'undefined') {
                    throw new Error("Supabase não inicializado. Verifique supabase-config.js");
                }

                const { data, error } = await _supabase
                    .from('developments')
                    .select('*')
                    .order('title', { ascending: true });

                if (error) throw error;
                empreendimentosDB = data || [];

                popularIncorporadoras();
                filtrarEmpreendimentosPorIncorporadora();
            } catch (err) {
                console.error("Erro ao carregar empreendimentos:", err);
                document.getElementById('loadingMatriz').innerHTML = `<p class="text-red-400 font-bold">Erro ao conectar ao banco de dados: ${err.message}</p>`;
            }
        }

        function popularIncorporadoras() {
            const selectInc = document.getElementById('selIncorporadora');
            const incs = [...new Set(empreendimentosDB.map(d => d.builder || d.developer_name || 'AAM Incorporadora'))].sort();

            selectInc.innerHTML = '<option value="TODAS">Todas as Incorporadoras</option>' +
                incs.map(i => `<option value="${i}">${i}</option>`).join('');
        }

        function filtrarEmpreendimentosPorIncorporadora() {
            const inc = document.getElementById('selIncorporadora').value;
            const selectEmp = document.getElementById('selEmpreendimento');

            const filtrados = empreendimentosDB.filter(d => {
                const devInc = d.builder || d.developer_name || 'AAM Incorporadora';
                return inc === 'TODAS' || devInc === inc;
            });

            selectEmp.innerHTML = filtrados.map(d => `<option value="${d.id}">${d.title} (${d.builder || d.developer_name || 'AAM'})</option>`).join('');

            if (filtrados.length > 0) {
                selectEmp.value = filtrados[0].id;
                carregarEstoqueEmpreendimento();
            } else {
                selectEmp.innerHTML = '<option value="">Nenhum empreendimento encontrado</option>';
                desenharMatriz();
            }
        }

        async function carregarEstoqueEmpreendimento() {
            const devId = document.getElementById('selEmpreendimento').value;
            const loading = document.getElementById('loadingMatriz');
            const container = document.getElementById('containerMatriz');

            if (!devId) {
                desenharMatriz();
                return;
            }

            loading.classList.remove('hidden');
            container.classList.add('hidden');

            try {
                const { data, error } = await _supabase
                    .from('units')
                    .select('*, developments(*)')
                    .eq('development_id', devId)
                    .order('floor', { ascending: false });

                if (error) throw error;
                unidadesDB = data || [];

                desenharMatriz();
            } catch (err) {
                console.error("Erro ao buscar estoque das unidades:", err);
                loading.innerHTML = `<p class="text-red-400 font-bold">Erro ao carregar unidades do empreendimento.</p>`;
            }
        }

        function desenharMatriz() {
            const loading = document.getElementById('loadingMatriz');
            const container = document.getElementById('containerMatriz');

            loading.classList.add('hidden');
            container.classList.remove('hidden');

            if (unidadesDB.length === 0) {
                container.innerHTML = `<div class="py-12 text-center text-slate-500 font-bold text-xs">Nenhuma unidade cadastrada para este empreendimento no banco de dados.</div>`;
                atualizarContadores([]);
                return;
            }

            const andares = [...new Set(unidadesDB.map(u => parseInt(u.floor) || 0))].sort((a, b) => b - a);

            let html = '';
            andares.forEach(andar => {
                const unidadesAndar = unidadesDB.filter(u => (parseInt(u.floor) || 0) === andar);
                unidadesAndar.sort((a, b) => String(a.unit_number).localeCompare(String(b.unit_number), undefined, { numeric: true }));

                html += `
                    <div class="flex items-center gap-2 border-b border-slate-700/40 pb-1.5 tr-andar" data-andar="${andar}">
                        <span class="w-16 text-xs text-amber-400 font-black flex-shrink-0">${andar}º Andar</span>
                        <div class="flex flex-wrap gap-1.5 flex-1">
                            ${unidadesAndar.map(u => `
                                <button id="btn_unit_${u.id}"
                                        onclick="clicarUnidade('${u.id}')"
                                        ondblclick="simularUnidadeDirect('${u.id}')"
                                        data-num="${String(u.unit_number).toLowerCase()}"
                                        data-gaveta="${u.income_type || 'R2V'}"
                                        data-status="${u.status || 'DISPONIVEL'}"
                                        title="Clique duplo para Simular na SuperCalc"
                                        class="unit-btn px-2.5 py-1.5 rounded-lg text-xs font-bold shadow ${getEstiloStatus(u.status)} flex flex-col items-center leading-tight">
                                    <span>${u.unit_number}</span>
                                    <span class="text-[9px] opacity-80 uppercase">${u.income_type || 'R2V'}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            aplicarFiltrosMatriz();
        }

        function getEstiloStatus(status) {
            switch (status) {
                case 'INDISPONIVEL':
                case 'BLOQUEADO':
                case 'VENDIDO':
                case 'RESERVADO':
                    return 'bg-red-600 hover:bg-red-500 text-white';
                case 'PROMOCIONAL':
                    return 'bg-blue-600 hover:bg-blue-500 text-white';
                default:
                    return 'bg-emerald-600 hover:bg-emerald-500 text-white';
            }
        }

        function setFiltroGaveta(gaveta, btn) {
            filtroGavetaAtual = gaveta;
            document.querySelectorAll('.btn-gaveta').forEach(b => {
                b.classList.remove('bg-amber-400', 'text-slate-950');
                b.classList.add('bg-slate-900', 'text-slate-300');
            });
            btn.classList.remove('bg-slate-900', 'text-slate-300');
            btn.classList.add('bg-amber-400', 'text-slate-950');

            aplicarFiltrosMatriz();
        }

        function setModoClique(modo) {
            modoClique = modo;
            const btnTrava = document.getElementById('btnModoTrava');
            const btnPromo = document.getElementById('btnModoPromo');

            if (modo === 'TRAVA') {
                btnTrava.className = "w-full py-2 px-3 rounded-xl text-xs font-bold bg-red-600 hover:bg-red-500 text-white transition shadow flex items-center justify-center gap-1";
                btnPromo.className = "w-full py-2 px-3 rounded-xl text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 transition flex items-center justify-center gap-1";
            } else {
                btnPromo.className = "w-full py-2 px-3 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white transition shadow flex items-center justify-center gap-1";
                btnTrava.className = "w-full py-2 px-3 rounded-xl text-xs font-bold bg-slate-700 hover:bg-slate-600 text-slate-300 transition flex items-center justify-center gap-1";
            }
        }

        function aplicarFiltrosMatriz() {
            const busca = document.getElementById('txtBuscaUnidade').value.trim().toLowerCase();
            let visiveis = [];

            unidadesDB.forEach(u => {
                const btn = document.getElementById(`btn_unit_${u.id}`);
                if (!btn) return;

                const bateGaveta = filtroGavetaAtual === 'TODAS' || 
                                  (filtroGavetaAtual === 'LIVRE' ? (u.income_type === 'LIVRE' || u.income_type === 'AVULSO') : u.income_type === filtroGavetaAtual);
                const bateBusca = !busca || String(u.unit_number).toLowerCase().includes(busca);

                if (bateGaveta && bateBusca) {
                    btn.classList.remove('hidden');
                    visiveis.push(u);
                } else {
                    btn.classList.add('hidden');
                }
            });

            atualizarContadores(visiveis);
        }

        function atualizarContadores(lista) {
            const total = lista.length;
            const disp = lista.filter(u => u.status === 'DISPONIVEL' || !u.status).length;
            const promo = lista.filter(u => u.status === 'PROMOCIONAL').length;
            const indisp = lista.filter(u => u.status === 'INDISPONIVEL' || u.status === 'RESERVADO' || u.status === 'VENDIDO').length;

            document.getElementById('lblTotalMatriz').innerText = total;
            document.getElementById('lblDispMatriz').innerText = disp;
            document.getElementById('lblPromoMatriz').innerText = promo;
            document.getElementById('lblIndispMatriz').innerText = indisp;
        }

        async function clicarUnidade(id) {
            const unidade = unidadesDB.find(u => u.id === id);
            if (!unidade) return;

            let novoStatus = 'DISPONIVEL';
            if (modoClique === 'TRAVA') {
                novoStatus = unidade.status === 'INDISPONIVEL' ? 'DISPONIVEL' : 'INDISPONIVEL';
            } else if (modoClique === 'PROMO') {
                novoStatus = unidade.status === 'PROMOCIONAL' ? 'DISPONIVEL' : 'PROMOCIONAL';
            }

            unidade.status = novoStatus;

            const btn = document.getElementById(`btn_unit_${id}`);
            if (btn) {
                btn.className = `unit-btn px-2.5 py-1.5 rounded-lg text-xs font-bold shadow ${getEstiloStatus(novoStatus)} flex flex-col items-center leading-tight`;
            }

            try {
                const { error } = await _supabase
                    .from('units')
                    .update({ status: novoStatus })
                    .eq('id', id);

                if (error) throw error;
                aplicarFiltrosMatriz();
            } catch (err) {
                console.error("Erro ao atualizar status no banco:", err);
                alert("Falha ao salvar a alteração no banco de dados.");
            }
        }

        async function alterarStatusVisiveis(novoStatus) {
            const busca = document.getElementById('txtBuscaUnidade').value.trim().toLowerCase();
            const visiveis = unidadesDB.filter(u => {
                const bateGaveta = filtroGavetaAtual === 'TODAS' || 
                                  (filtroGavetaAtual === 'LIVRE' ? (u.income_type === 'LIVRE' || u.income_type === 'AVULSO') : u.income_type === filtroGavetaAtual);
                const bateBusca = !busca || String(u.unit_number).toLowerCase().includes(busca);
                return bateGaveta && bateBusca;
            });

            if (visiveis.length === 0) return;

            if (!confirm(`Deseja alterar o status de ${visiveis.length} unidade(s) visível(is) para "${novoStatus}"?`)) {
                return;
            }

            const ids = visiveis.map(u => u.id);
            visiveis.forEach(u => u.status = novoStatus);

            try {
                const { error } = await _supabase
                    .from('units')
                    .update({ status: novoStatus })
                    .in('id', ids);

                if (error) throw error;
                desenharMatriz();
            } catch (err) {
                console.error("Erro ao alterar em lote:", err);
                alert("Erro ao aplicar alteração em lote no banco de dados.");
            }
        }

        function simularUnidadeDirect(id) {
            const u = unidadesDB.find(item => item.id === id);
            if (!u) return;

            const itemPayload = {
                id: u.id,
                empreendimento: u.developments?.title || 'Empreendimento',
                construtora: u.developments?.builder || u.developments?.developer_name || 'AAM Incorporadora',
                unidade: u.unit_number,
                pavimento: u.floor,
                tipologia: u.typology,
                income_type: u.income_type || 'R2V',
                m2: u.private_area_m2,
                precoTabela: u.list_price,
                preco: u.list_price,
                val_ato: u.val_ato,
                val_30_60_90: u.val_30_60_90,
                qtd_mensais: u.qtd_mensais,
                val_mensal_unit: u.val_mensal_unit,
                qtd_anuais: u.qtd_anuais,
                val_anual_unit: u.val_anual_unit,
                val_periodicidade: u.val_periodicidade,
                val_chaves_unica: u.val_chaves_unica,
                val_financiamento: u.val_financiamento,
                data_entrega: u.developments?.delivery_date || '2029-12'
            };

            localStorage.setItem("UNIDADE_SELECIONADA", JSON.stringify(itemPayload));
            window.location.href = "supercalc.html";
        }
    </script>
</body>
</html>
